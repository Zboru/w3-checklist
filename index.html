ap is the New Stripe' and must be completed before going down to do the \nlaundry, or it will fail."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:using your loaf","name":"Using Your Loaf","namePl":null,"level":null,"tips":["-Using your loaf (Gwent game if Syanna dies and you go to prison. Over by the entrance to the cells). This also\nmust be completed before going down to do the laundry, or it will fail."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:be it ever so humble","name":"Be It Ever So Humble...","namePl":"Wszędzie dobrze...","level":49,"tips":["-If Yen is with you in the end of Blood and Wine, you can find a dress in her room that is white and green \n(something you suggested to her). Triss would get a pink and yellow one.","-Visit Regis's hideout after the game and you can see he takes all or most of his lab equipment whether \nhe remains or not.","-Find the note and mutagenerator from Regis next to your bedside after 'Be it Ever so Humble'. Attached is\ninformation about the mutagenerator. In the notes section of the link, it will describe how to use it.","-Once you finish 'Be it Ever so Humble' and after some time has passed, you'll find a stuffed unicorn in your \nbedroom in Corvo Bianco if you romanced Yen."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Be_It_Ever_So_Humble","mapUrl":null}]},{"region":"Blood And Wine","steps":[{"id":"k:blood simple","name":"Blood Simple","namePl":"Zew krwi","level":47,"tips":["-During 'Blood Simple', you can stay to listen to all of Orianna's song and Geralt will comment 'nice tune'.","-At Orianna's place or at a couple gates in Toussaint, you can find a picture of a portrait. This is a reference to \nMarcin Iwinski who is one of the founders of CDPR, the developer team of The Witcher 3.","-During 'Blood SImple', if you take that path, you can find 3 pieces of evidence that Orianna is using the \nchildren for blood before meeting with her @2:30."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:what lies unseen","name":"What Lies Unseen","namePl":"Między światami","level":47,"tips":["-In 'What Lies Unseen', when in the boat with Regis, if you stand up, he'll make a comment about meeting you \nthere instead and will change into a wisp of smoke.","-In 'What Lies Unseen', if you ask the Unseen Elder more than one question (text that isn't yellow), he'll kill you. \nAlso, when there are 3 yellow options, only the 3rd is correct. If you choose the first two options back to back, \nhe will kill you.","-In 'What Lies Unseen', there is another way to die after the encounter with the Unseen Elder. After he tosses \nyou away, if you don't drink the Swallow potion in time, your health will fully deplete. Also, drinking black blood \nbefore the encounter doesn't do anything.","-The Hen'gaidth armor set @6:33 (red version). Gauntlets, steel sword, mask, trousers, armor, and boots. The \narmor and boots are found right after being flipped upside down. The rest is found beforehand. Gauntlets and \nsword before meeting the Unseen Elder for the first time. Mask and trousers in a side path while following the \nmage's footprints and after defeating a few vampires."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:tesham mutna","name":"Tesham Mutna","namePl":"Tesham Mutna (zadanie)","level":49,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:pomp and strange circumstance","name":"Pomp and Strange Circumstance","namePl":"Ceremonia","level":49,"tips":["-During this second time you meet the bootblack with Regis, don't wear any shoes to have a unique scene with \nhim. If you also don't have boots in your inventory, he will polish your barefeet.","-The correct dialogue choices with Syanna during 'Pomp and Strange Circumstance' in order to get the good \r\nending is the following: \"Cause she turned her back on you, forgot about you.\" and then \"Ever thought to \r\nforgive her?\"","-At the end of Blood and Wine, at the ceremony with Ana Henrietta and Syanna, there will be characters that \nwill attend the ceremony if you solved their issues. You can see Guillaume and Vivienne (Warble of a Smitten \nKnight - transfer the curse to Guillaume), Francois and Jaquette (Feet as Cold as Ice - If you convinced Francois \nto return to Jaquette), Martin Monnier (Gwent: To Everything - Turn, Turn, Tournament! - He's the one promoting \nthe Skellige faction. He will appear if you took part in the Gwent tournament), Brigitte/Still Waters (Female \nfistfighter in the Fists of Fury: Toussaint quest), and even the noblewoman that lost her ring at the palace \ngardens.","-The last scene that determines Anarrieta's fate, she will be wearing all blue jewels if Syanna will kill her \nand she will wear one red jewel if Syanna is about to forgive her.","-During the 'bad ending' of Blood and Wine, before attending the funeral, there is a woman that is selling \nflowers and says that Anna Henrietta's favourite flower was the white rose. You can find a single white rose \nwhere the murder occurred, just south of the Palace Gardens.","-At the top of the castle in Beauclair, you can see a lot of flags mounted. If Ana Henrietta dies, these flags will \nchange. You can also find some other things around the city like Celtic Crosses, an image of a French \nRooster, and depictions of the Dance of Death.","-During 'Pomp and Strange Circumstance', if you don't put on the mask and gloves, Geralt will make agonizing \nsounds while picking the mandrake root."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:be it ever so humble","name":"Be It Ever So Humble...","namePl":"Wszędzie dobrze...","level":49,"tips":["-If Yen is with you in the end of Blood and Wine, you can find a dress in her room that is white and green \n(something you suggested to her). Triss would get a pink and yellow one.","-Visit Regis's hideout after the game and you can see he takes all or most of his lab equipment whether \nhe remains or not.","-Find the note and mutagenerator from Regis next to your bedside after 'Be it Ever so Humble'. Attached is\ninformation about the mutagenerator. In the notes section of the link, it will describe how to use it.","-Once you finish 'Be it Ever so Humble' and after some time has passed, you'll find a stuffed unicorn in your \nbedroom in Corvo Bianco if you romanced Yen."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Be_It_Ever_So_Humble","mapUrl":null},{"id":"k:paperchase","name":"Paperchase","namePl":"Klient ma zawsze rację","level":36,"tips":["-In 'Paperchase', if you wait the week, you will get more than double the coin, plus a sword called The Reckoner.","-In the quest 'Paperchase', if Geralt gets kicked out of the bank by getting too aggressive in the vault, but \ngetting beaten by the dwarves, you will notice that there is a board to the left when you enter the bank. This \nboard previously had 4 drawings of people that should not be served. If you were kicked out, then a drawing \nof Geralt will also appear there."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=403857"},{"id":"k:goodness gracious great balls of granite","name":"Goodness, Gracious, Great Balls of Granite!","namePl":"Bohater narodowy","level":36,"tips":["-In 'Goodness, Gracious, Great Balls of Granite!', you can let the curator have them for a day before \nreturning them.","-In 'Goodness, Gracious, Great Balls of Granite!', if you give Hughes the stones for good, he actually passes \naway from using them too intensely. If you visit his place after the quest, you can find out this information.","-After completing 'Goodness, Gracious, Great Balls of Granite!', you can stroke Reginald's jewels to \nacquire a buff for an hour.","-Just Northwest of the Metinna Gate in Toussaint, you can find a painting on a wall that will change depending \non the angle that you look at it."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=216023"},{"id":"k:father knows worst","name":"Father Knows Worst","namePl":"Braterska miłość","level":37,"tips":["-After 'Father Knows Worst', if the Brothers made peace, you can find them at the Clever Clogs \nInn @4:47 (one will offer better prices than most vendors. They also have a painting of their father).","-At the Clever Clogs, after the quest, you can interact with a painting on the wall, but you have to be partially\nup the stairs. I could not trigger the interaction with the painting, even partially up the stairs, and that might be \ndue to the next gen edition, but the video is still there to check out."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=216026"},{"id":"k:a knight s tales","name":"A Knight's Tales","namePl":"O damie i jej rycerzu","level":40,"tips":["-There are 4 possible endings to this quest. The first is that you can lift the curse yourself, WITHOUT Sir \nGareth's bones. The second is politely asking the witch for help and trading a lock of your hair. The third is \nto threaten the witch into helping you. The fourth is saying to the witch that you'll solve the curse yourself \nand find the hidden caves right after to find Gareth's remains before going back to the tree. This allows for \nthe best ending and you don't have to give a lock of hair to the witch. Further information can be found in \nthe link to the left or the attached video link on this extra detail.","-Theory about the crone, Whispess, and her involvement with Daphne from 'A Knight's Tales' as well as \ncontradictions to the theory."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Knight%27s_Tales_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=215992"},{"id":"k:big feet to fill","name":"Big Feet to Fill","namePl":"Komu w drogę, temu w czas","level":40,"tips":["-The blacksmith in Ardaiso Quarry during 'Big Feet to Fill' has some unique dialogue if you speak to him."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Big_Feet_to_Fill_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=953342"},{"id":"k:big feet to fill the first group","name":"Big Feet to Fill: The First Group","namePl":null,"level":40,"tips":["-Note of a murderer found @14:08 (Edward Scissorhands reference)."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:big feet to fill the second group","name":"Big Feet to Fill: The Second Group","namePl":null,"level":40,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:big feet to fill the third group","name":"Big Feet to Fill: The Third Group","namePl":null,"level":40,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:big feet to fill the fourth group","name":"Big Feet to Fill: The Fourth Group","namePl":null,"level":40,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:big feet to fill the fifth group","name":"Big Feet to Fill: The Fifth Group","namePl":null,"level":40,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:master master master master","name":"Master Master Master Master!","namePl":"Więcej niż mistrz","level":40,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:the words of the prophets are written on sarcophagi","name":"The Words of the Prophets Are Written on Sarcophagi","namePl":"Kości Wielkiego Żebraka","level":40,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:mutual of beauclair s wild kingdom","name":"Mutual of Beauclair's Wild Kingdom","namePl":"Równowaga w przyrodzie","level":46,"tips":["-In the quest 'Mutual of Beauclair's Wild Kingdom', you will encounter a group of men called the Reavers. They \nwill have tattoos on their bodies. On their face, some of it translates to 'Mother', 'Father', and 'Rodzina', which \nmeans family.","-In 'Mutual of Beauclair's Wild Kingdom', if Iocaste lives, you can meet some armed soldiers some time later \nwhich leads to Iocaste's hunting ground @10:14 (You can see the basilisk in the sky as well).","-If you kill Iocaste in 'The Mutual of Beauclaire's Wild Kingdom', you can find her grave at the spot \nthat you killed her @3:22."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=953827"},{"id":"k:knight for hire","name":"Knight for Hire (-)","namePl":"Rycerz do wynajęcia","level":null,"tips":["-During the 'Knight for Hire' quest, go to the place you go to claim your rewards, you can find a clue that \nSyanna is connected to the heart of Toussaint @14:31 (look at the painting and Syanna will be wearing \nthe jewel)."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:big game hunter","name":"Big Game Hunter","namePl":"Beauclairskie safari","level":37,"tips":["-In 'Big Game Hunter', face towards him when he uses his flash @1:40 (when releasing the panther).","-In 'Big Game Hunter', you can haggle for the highest price and he'll agree to it.","-In 'Big Game Hunter', if you attack or kill the animals on the expedition (bear, panthers, peacocks, and \ncentipedes), the Count will have a negative reaction and there will be no pictures/paintings at the end."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=426016"},{"id":"k:vitner s contract rivecalme storehouse","name":"Vitner's Contract: Rivecalme Storehouse","namePl":"Zlecenie winiarzy: Magazyn na Cichym Brzegu","level":37,"tips":["-Find a Winnie the Pooh bear @12:36 (he drops a jar of honey when killed). I couldn't get this bear to trigger\nuntil AFTER I completed the main questline."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:vitner s contract chuchote cave","name":"Vitner's Contract: Chuchote Cave","namePl":"Zlecenie winiarzy: Jaskinia Szept","level":40,"tips":["-In the 'Vitner's Contract: Chuchote Cave', the description of the signpost when you are looking at the map, \nwill tell you that it used to be the home of the crone Whispess."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=29656"},{"id":"k:vitner s contract cleaning those hard to reach places","name":"Vitner's Contract: Cleaning Those Hard-to-Reach Places","namePl":"Zlecenie winiarzy: Szara Grota","level":40,"tips":["-Girl that says an Arya Stark quote @11:27. She usually says this around 7pm."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:vitner s contract dun tynne hillside","name":"Vitner's Contract: Dun Tynne Hillside","namePl":"Zlecenie winiarzy: Wzgórze Dun Tynne","level":40,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:vitner s contract duchaton crest","name":"Vitner's Contract: Duchaton Crest","namePl":"Zlecenie winiarzy: Koci Grzbiet","level":43,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:equine phantoms","name":"Equine Phantoms","namePl":"O czym szepczą grzyby","level":44,"tips":["-In 'Equine Phantoms', the woman you speak to has certain markings on her necklace. They may be \nrepresenting her name, though the spelling can be odd (Hanna Soieszczka Trebinska). You can also see \na whip around her shoulders with nails on the end because she is a flaggellant, which are people that \nflog/whip themselves or others.","-In 'Equine Phantoms', if you choose to accept the potatoes, you can haggle for how many you get.","-In 'Equine Phantoms', even if you accept or decline her offer of potatoes, you can go to her cellar to take \nmore of her potatoes.","-During 'Equine Phantoms', once you drink the potion, you can go around and communicate with the \nother animals in the area (wolf, 2 dogs, 2 goats (south-west of the hut), a cow, and 3 cats (one is near the cow, \nanother at the opposite side of the house where the wood chopping block is. The third is across from the house, \nwhere the hermit is working on the flowers. This one has a male voice)).","-In 'Equine Phantoms', there is a scenario where Roach can complete the quest on her own. This occurs if you \ntake the mushrooms, and then abandon and leave the area, then return to the woman.","-In 'Equine Phantoms', when following the umbral, if you go in a different direction, there will be a cutscene with \na different interaction with Roach where she begins to say a joke before being cut off because the potion wears \noff. Doing this will fail the quest, but you can reload a save.","-During 'Equine Phantoms', when you chase the umbra to the graveyard, it disappears for a bit and circles the \ngravestone. If you get close enough to it, you will see that this invisible spectre is called an incubus, which is \nthe male equivalent of a succubus.","-If Roach does not forgive the spirit in 'Equine Phantoms', the woman that gave you the quest dies. She can \nalso die if you fail to catch the spirit. You will find her body completely drained of blood a couple days later. \nEven though Geralt warns the woman that she will still have to watch out for the spirit and suggests to put a \nline of salt at her door (which she actually does), she still won't make it. Her dead body also has longer hair \ncompared to her original character design."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=290523"},{"id":"k:feet as cold as ice","name":"Feet as Cold as Ice","namePl":"Jeśli nie chcesz mojej zguby...","level":45,"tips":["-There are 3 possible endings to 'Feet as Cold as Ice'. The first is if Francois died, Jacquette will be devastated \nand you will not get a reward. The second is if Francois is alive and you convinced him to return to Jacquette, \nshe will be very happy and will reward you. The third is if Francois is alive and you told him to do what he wants, \nJacquette will realize Francois' true motives, but will still pay you for your efforts."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=216004"},{"id":"k:the tufo monster","name":"The Tufo Monster","namePl":"Zlecenie: Monstrum z Tufo","level":48,"tips":["-If you find the pendant during 'The Tufo Monster', there can be two different endings. One where you expose \nthe individual, or keep their secret safe."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=426015"},{"id":"k:coin doesn t stink","name":"Coin Doesn't Stink","namePl":"Pieniądze nie śmierdzą","level":37,"tips":["-Calvin and Hobbs easter egg @13:47 (Hobbs is a panthe
