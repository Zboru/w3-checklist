:root {
  --bg: #101014;
  --bg-soft: #17171d;
  --bg-row: #1c1c23;
  --bg-row-done: #15151a;
  --fg: #eceaf2;
  --fg-dim: #a4a1b3;
  --line: #2b2b34;
  --accent: #d8b56b;
  --accent-2: #8ec07c;
  --danger: #e06c75;
  --radius: 12px;
  --tap: 44px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
  overflow-x: clip;
}

body { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }

h1, h2, h3, p, ul, li { margin: 0; }
ul { list-style: none; padding: 0; }
a { color: var(--accent); }

/* ---------- header ---------- */
.top {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 10px) 12px 8px;
}

.top-row { display: flex; align-items: center; gap: 8px; }
.top-row h1 { flex: 1; font-size: 1.1rem; font-weight: 650; letter-spacing: .2px; }
.top-row .sub { display: block; font-size: .72rem; font-weight: 400; color: var(--fg-dim); }

.icon-btn {
  min-width: var(--tap); min-height: var(--tap);
  background: var(--bg-soft); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px;
  font-size: 1.1rem; cursor: pointer;
}

.tabs { display: flex; gap: 6px; margin: 8px 0 6px; }
.tab {
  flex: 1; min-height: 38px;
  background: var(--bg-soft); color: var(--fg-dim);
  border: 1px solid var(--line); border-radius: 10px;
  font-size: .92rem; font-weight: 600; cursor: pointer;
}
.tab.active { background: var(--accent); color: #1a1508; border-color: var(--accent); }

.progress { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.bar { flex: 1; height: 8px; background: var(--bg-soft); border-radius: 99px; overflow: hidden; }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .2s; }
.pct { font-size: .82rem; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.count { font-size: .78rem; color: var(--fg-dim); font-variant-numeric: tabular-nums; }

.controls { display: flex; flex-direction: column; gap: 8px; }
#search {
  width: 100%; min-height: var(--tap);
  background: var(--bg-soft); color: var(--fg);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 0 12px; font-size: 1rem;
}
#search::placeholder { color: var(--fg-dim); }

.toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.switch { display: inline-flex; align-items: center; gap: 7px; font-size: .85rem; color: var(--fg-dim); min-height: 32px; }
.switch input { width: 18px; height: 18px; accent-color: var(--accent); }

.fab {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right));
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 30;
  width: 56px; height: 56px;
  display: grid; place-items: center;
  background: var(--accent); color: #1a1508;
  border: 1px solid var(--accent); border-radius: 50%;
  font-size: 1.5rem; line-height: 1;
  box-shadow: 0 6px 18px rgba(0, 0, 0, .45);
  cursor: pointer;
  transition: transform .12s, box-shadow .12s, opacity .12s;
}
.fab:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0, 0, 0, .5); }
.fab:active { transform: translateY(0) scale(.96); }
.fab:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.fab:disabled { opacity: .55; background: var(--bg-soft); color: var(--fg-dim); border-color: var(--line); box-shadow: none; cursor: default; transform: none; }
.fab[hidden] { display: none; }

/* ---------- content ---------- */
.main { padding: 10px 12px 24px; max-width: 760px; margin: 0 auto; }

.chapter {
  position: sticky; top: var(--header-h, 0px); z-index: 5;
  margin: 14px 0 8px; padding: 8px 10px;

ow a new animation for picking up herbs.","-You can parry and break enemies' spears in combat, but it has to be the right kind of spear to do this. \nHalberds and poleaxes cannot be parried or broken, only simple spears.","-You can now walk backwards while on horseback, do a flourish when going from idle to a gallop, and achieve a \nunique sort of backflip dismount animation when getting off Roach in tight spaces.","-You can pet Roach now by holding down the jump button when your right hand is towards the head.","-Roach can now kick enemies. She can even knock down werewolves so that you can do a finisher move on \nthem. There is no other way to knock down a werewolf.","-Roach can now run over enemies and either stagger or kill them. The dismount animations are now triggered \nbased on where the camera angle is positioned.","-Find Yen's raven skull at the beginning area (give it back to Yen eventually), see the battle from the \nintro, horse head, items from guy that Yen crashed into, etc.","-During Lilac and Gooseberries, you can find a Lion King reference. While riding past the ransacked village, \ntake a walk and see a boy talking with his dead father. It references Simba and Mufasa. \nTo get the full dialogue, you have to visit the location twice during the same quest.","-During Lilac and Gooseberries, before you speak with Gaunter O'Dimm, you will talk with some soldiers \nat one of the tables. One of their friends was tossed off their horse into a ditch. You can find the body between \nthe Nilfgaardian Garrison and the battlefield.","-During Lilac and Gooseberries, you can find a soldier that looks like Lena's lover (the woman that you \nmay or may not have given the Swallow potion to in Tomira's hut).","-Though it may be difficult to recreate this interaction (or might not be true), someone thinks they may have \nfound Elthon, from the Witcher 2, in White Orchard. Two of his lines from Witcher 2 can sometimes be heard \nfrom a specific NPC in the Witcher 3 during 'Lilac and Gooseberries' just Northwest of Woesong Bridge on the \ndock fishing.","-North East of the Nilfgaardian Garrison, you can find a strumpet with some men under a bridge at night."],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Lilac_and_Gooseberries","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=20373"},{"id":"k:twisted firestarter","name":"Twisted Firestarter","namePl":"Zabawy z ogniem","level":1,"tips":["-Complete before the griffin.","-Deleted character with the Brothers in Arms mod where Willis, the blacksmith in White Orchard, can be \nreplaced by a human blacksmith later on in the game if you return."],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=twisted-firestarter"},{"id":"k:a frying pan spick and span","name":"A Frying Pan, Spick and Span","namePl":"Patelnia jak nowa","level":1,"tips":["-Complete before the griffin.","-Break open the door to the house before talking to the frying pan lady to get unique dialogue.","-Thaler's monocle dialogue is now fixed in the next gen update. Make sure to pick up the monocle in\n 'A Frying Pan, Spick and Span', so you can return it to Thaler in 'A Deadly Plot'."],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Frying_Pan,_Spick_and_Span","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=a-frying-pan-spick-and-span"},{"id":"k:precious cargo","name":"Precious Cargo","namePl":"Cenna przesyłka","level":1,"tips":["-Complete before the griffin."],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Precious_Cargo","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=precious-cargo"},{"id":"k:missing in action","name":"Missing in Action","namePl":"Zaginiony w akcji","level":1,"tips":["-Complete before the griffin.","-During 'Missing in Action' you can see that Dune is missing a couple fingers."],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Missing_in_Action","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=missing-in-action"},{"id":"k:devil by the well","name":"Devil by the Well","namePl":"Zlecenie: Licho przy studni","level":2,"tips":["-Visit Tomira after Devil by the Well for more lore about the fate of the villagers. Tomira is the herbalist woman\nyou will meet during 'The Beast of White Orchard' and 'On Death's Bed'.","-Deleted dialogue with the Brothers in Arms mod where the noonwraith would speak during 'Devil by the Well'."],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Devil_by_the_Well","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=contract-devil-by-the-well"},{"id":"k:on death s bed","name":"On Death's Bed","namePl":"Na łożu śmierci","level":2,"tips":["-This is started during The Beast of White Orchard when you speak with Tomira. Complete before the griffin.","-Tomira in White Orchard will buy honey comb for 7 coins whereas other merchants will only buy it for \n4 coins. If you aard a beehive all the way to Tomira's hut, it will actually kill her.","-Lena's fate is determined in the Nilfgaardian camp later on in the game. I've put a reminder next to some quests\nthat are closer to that area."],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/On_Death%27s_Bed","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=on-deaths-bed"},{"id":"k:the beast of white orchard","name":"The Beast of White Orchard","namePl":"Bestia z Białego Sadu","level":3,"tips":["-Hidden area of Nilgaardian camp. Open the door, climb the stairs, jump over the wall, and aard.","-During 'The Beast of White Orchard', you can find an interesting sketch on the table of the Nilfgaardian captain. \nIt appears to be a map of White Orchard.","-You can find Florian's grave in the cemetary and it has a wooden sword. It doesn't state the truth of the love\nbetween him and Mislav.","-You can Aard the beehives in White Orchard and kill merchants in the area, including Tomira and the man \nwho teaches you how to play Gwent, and then get all of their loot. This may not work in the next gen upgrade \nanymore since the bees now leave once you knock down the hive.","-During The Beast of White Orchard, before talking with Vesemir, you can overhear him and another man \ntalking about Boyan Klimmick who might be the man who was whipped back at the Nilfgaardian camp, though\nvery unlikely. Vesemir might be the one behind the tampering of the grain, but once again, very unlikely. The\ngrain was just rotten instead of poisoned. This is all just a little theory, but has been proven to be untrue.","-If you remain in the fort after reporting the Griffin's death, you can hear the sound of whipping and the punished \npeasant crying in pain. The whiplashes will be struck 15 times as sentenced before the sound stops completely."],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Monster_Hunts","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=180893"},{"id":"k:lilac and gooseberries part 2","name":"Lilac and Gooseberries Part 2","namePl":"Bez i agrest","level":1,"tips":["-Spawn a chort by killing a bunch of cows."],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Lilac_and_Gooseberries","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=20373"},{"id":"k:the incident at white orchard","name":"The Incident at White Orchard","namePl":"Incydent w Białym Sadzie","level":2,"tips":[],"nonMissable":false,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/The_Incident_at_White_Orchard","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=180892"},{"id":"k:dirty funds","name":"Dirty Funds","namePl":"Brudna forsa","level":2,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=hidden-treasure0"},{"id":"k:deserter gold","name":"Deserter Gold","namePl":"Złoto dezerterów","level":3,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=hidden-treasure"},{"id":"k:temerian valuables","name":"Temerian Valuables","namePl":"Temerskie precjoza","level":4,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=treasure-hunt-temerian-valuables"},{"id":"k:viper silver sword basic","name":"Viper Silver Sword (Basic)","namePl":null,"level":6,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:viper steel sword basic","name":"Viper Steel Sword (Basic)","namePl":null,"level":6,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Vizima","steps":[{"id":"k:imperial audience","name":"Imperial Audience","namePl":"Audiencja","level":2,"tips":["-Speak with Morvran Voorhis and his friend about neutrality during 'Imperial Audience' (follow the chamberlain).","-New gear found in a chest in Yennifer's room in Vizima (Steel Sword of a Thousand Flowers, White Widow of \nthe Valley of Flowers Silver Sword, armor, boots, gauntlets, and trousers of a Thousand Flowers, Nine-tailed \nVixen steel and silver sword, and White Tiger of the West armor, boots, trousers, and vambraces.","-Best choices are: spared Aryan, sided with Vernon, saved Triss, saved Sile, spared Letho.","-Enter a secret chamber by pressing a stone @0:19.","-In Vizima, the chamberlain will give a different reaction to each of the 3 black outfits. He doesn't seem \nto like the one with the tight belt.","-In Vizima, you can keep your towel for the rest of the game by dropping it and then picking it up after you\n pick your black outfit.","-Deleted scene of Emhyr cutting the old tree in Vizima."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Imperial_Audience","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/vizima-palace?marker=555352"}]},{"region":"Velen","steps":[{"id":"k:funeral pyres","name":"Funeral Pyres","namePl":"Stosy pogrzebowe","level":3,"tips":["-If you do 'Funeral Pyres' before 'In the Eternal Fire's Shadow', you will get some unique dialogue.","-During the quest 'Funeral Pyres', when meeting the Eternal Fire Priest, you can see a map of the Witcher \nworld lying on the stone table next to the priest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Funeral_Pyres","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=funeral-pyres"},{"id":"k:at the mercy of strangers","name":"At the Mercy of Strangers","namePl":"Na łasce obcych","level":null,"tips":["-If you save John Verdun, there will be a second part to this quest. You can find him again north of Ursten (you\ncan check the map in the attached quest page link). Make sure to do this when you pass by while completing\n'The Nilfgaardian Connection'. Complete both parts as soon as possible, otherwise John Verdun will die.","-If you save John Verden, during 'At the Mercy of Strangers', in the second spot that he appears, you can find a \nnote from a refugee at the back of his camp."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the nilfgaardian connection","name":"The Nilfgaardian Connection","namePl":"Nilfgaardzki łącznik","level":5,"tips":["-During 'The Nilfgaardian Connection', if you don't go to the inn at the crossroads right away and find Henrik \ninstead, you'll get a unique interaction when visiting the Baron's castle during the quest 'Bloody Baron'.","-During the 'Nilfgaardian Connection', as you make your way to the inn at the crossroads, there is a man that \nsends his daughter away in case the Baron's men return. You can even follow her and see her cowering in the \nwoods or get attacked, though she can't actually die. If you don't kill the Baron's men in the inn, they will be \nasking the man about his daughter later on. There is also a couple that is concerned about their pigs and the \nman says he'd rather slaughter them then let the Baron's men have them.","-During 'The Nilfgaardian Connection', even if you resolve the matter with the Baron's men peacefully, you can \nstill get into a fight if you pester them long enough after the conversation.","-If you fall from a great distance and die, you will sometimes hear a Wilhelm scream.","-You can now find a candle lantern in a cave North West of the Hanged Man's Tree.","-The Wild Hunt do not appear in the bestiary, so it can be useful to know that Elemental Oil works against them.","-You can find the man that teaches you how to play gwent hanging from the Hanged Man's Tree near Mulbrydale. You can loot an unfinished book under him."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:man s best friend","name":"Man's Best Friend","namePl":"Najlepszy przyjaciel człowieka","level":null,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Man%27s_Best_Friend","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=starving-children"},{"id":"k:deadly crossing ii","name":"Deadly Crossing (II)","namePl":"Śmiertelna przeprawa","level":null,"tips":["-Deadly crossing 2 is triggered by going across when Nilfgaardian soldiers are alive, then coming back at \na later time.","-Where to find the powerful sword called Moonblade. It is South West of Mulbrydale, in the water West of \nthe bridge.","-The traveling merchant switches between 3 main locations. Here is a map of where they are. He has \ndialogue at each place. First spot is west of Crow's Perch near Blackbough.","-Second traveling merchant spot is east of Glory Gate.","-Third traveling merchant spot is near Carston."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:hazardous goods","name":"Hazardous Goods","namePl":"Niebezpieczny ładunek","level":5,"tips":["-Complete immediately and must do before Ghosts of the Past.","-In Hazardous Goods, if you help burn the cart, meditate far away from the area for 10-12 \ndays and the man will reappear @5:48.","-During 'Hazardous Goods', there used to be a unique scene that was removed, but can be seen with a mod. \nThe man you speak with can bring up the fact that he thinks the Nilfgaardians brought the plague to Velen. \nDuring development, there was initially supposed to be a long quest about the plague.","-There's a large rock formation East of Lindenvale and South West of the starting point of 'Hazardous Goods'. \nThis rock formation is almost in the shape of a face."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:caravan attack","name":"Caravan Attack","namePl":"Atak na karawanę","level":null,"tips":["-The person you save from 'Caravan Attack' will show up as a shopkeeper at Crow's Perch."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:harassing a troll","name":"Harassing a Troll","namePl":"Dręczenie trolla","level":null,"tips":["-North West of the Inn of the Crossroads, you can pass through a Nilfgaardian camp and see a map of the \nContinent. The Redanians are on the opposite shore. On top of the hill, you can see a couple that have \ndied and are holding hands."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Harassing_a_Troll","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=harassing-a-troll"},{"id":"k:looters i","name":"Looters (I)","namePl":"Szabrownicy","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:face me if you dare i","name":"Face Me if You Dare (I)","namePl":"Zmierz się ze mną!","level":null,"tips":["-In 'Face me if you Dare', Ronvid is fighting for Lady Bilberry. You can find a notice on a nearby noticeboard that \nsays, \"My daughter Bilberry, a lovely girl and the apple of our eyes, died this year, the fourth of her short life. We \nburied her in the graveyard, by the crooked birch. Whoever wants to place a lump of earth or light a candle for \nher, that's where to go. — Butkins\"\nThis implies that Ronvid is Butkins and is fighting for his daughter that passed away."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:bloody baron","name":"Bloody Baron","namePl":"Krwawy Baron (zadanie)","level":6,"tips":["-Get the Nilfgaardian armor set from the quartermaster, which can be found in Crow's Perch along with matching \nhorse gear. Note that the set does not level with you, but if you wait until you are a higher level, the set will also \nbe a higher level.","-You can get the Nilfgaardian crossbow from the quartermaster at Crow's Perch (part of the elite crossbow set).","-Faster way to get up to the Smiths at Crow's Perch.","-Find the underwater cave that leads to Crow's Perch.","-You can see someone in Crow's Perch putting up the new signtravel post, which becomes available to use\nafter the baron questline.","-Secret room hiding a dead body in Crow's Perch."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Bloody_Baron","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555354"},{"id":"k:ciri s story the king of the wolves","name":"Ciri's Story: The King of the Wolves","namePl":"Historia Ciri: Król Wilków","level":5,"tips":["-In Ciri's Story: King of the Wolves, you can come back to this place as Geralt and fight a bear. \nIt is South East of Lindenvale."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:family matters part 1","name":"Family Matters (Part 1)","namePl":"Sprawy rodzinne","level":5,"tips":["-'Family Matters (Part 1)' is a long quest that goes up to the point of finding Anna and Tamara. The quests\nlisted below will be interwoven within Part 1 of 'Family Matters', up until Part 2 begins.","-During 'Family Matters', meet the stablehand afterwards if you saved him and he will reward you. This can be\r\ndone after 'Ciri's Story: The Race' and the big event that occurs at Crow's Perch.","-During 'Family Matters', you will see lines of salt in front of the houses when you are about to deal \nwith the botchling. This detail takes place after you have spoken with the pellar during 'A Princess\nin Distress'.","-Deleted dialogue with the Brothers in Arms mod where Geralt can say whether he prefers the botchling or \nlubberkin option during 'Family Matters'.","-Once you have completed 'A Princess in Distress' and have dealt with the botchling, after following the \nlumberkin, you can go to the Oxenfurt gate when trying to find Tamara, and you can trigger the 'Thou Shall \nNot Pass' quest. Once you get this quest started, return to the Baron to aquire the pass from him. Once you \ndo this, then you can do 'Bitter Harvest' and 'Fake Papers', but it is suggested to do these two quests when \nyou are a higher level since you will have to ensure someone is protected and kept alive in 'Bitter Harvest'.","-Nibbles the cat appears in multiple locations. Unlike most cats, this one is not afraid of you. You can \nencounter her first when meeting Tamara in Oxenfurt. The link shows all the other possible locations \nyou can find Nibbles.","-You can get into Oxenfurt's highest tower using parkour This is the top of the Borsodi's Auction House and \nwhere your team goes to do the heist in Hearts of Stone."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Family_Matters","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555363"},{"id":"k:ciri s room","name":"Ciri's Room","namePl":"Pokój Ciri","level":5,"tips":["-Complete before the Isle of the Mists."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Ciri%27s_Room","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=ciris-room"}]},{"region":"Skellige","steps":[{"id":"k:the mysterious passenger","name":"The Mysterious Passenger","namePl":"Tajemniczy pasażer łodzi","level":1,"tips":["-Complete before the Ladies of the Wood. You must do the Skellige quest, Calm Before the Storm, before being\nable to access this quest. The Mysterious Passenger is a very short quest that just involves dialogue on Uma, \nso doesn't really matter if you miss it."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Velen","steps":[{"id":"k:deadly crossing i","name":"Deadly Crossing (I)","namePl":"Śmiertelna przeprawa","level":null,"tips":["-Once you complete 'Deadly Crossing (I), make sure to do 'Deadly Crossing (III)' within a few in game days,\notherwise it may disappear."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:deadly crossing iii","name":"Deadly Crossing (III)","namePl":"Śmiertelna przeprawa","level":null,"tips":["-Complete 'Deadly Crossing (III) within a few days of completing 'Deadly Crossing (I), otherwise it may \ndisappear."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:highway robbery","name":"Highway Robbery","namePl":"Napad na trakcie","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:highwayman s cache","name":"Highwayman's Cache","namePl":"Śmiertelna przeprawa","level":null,"tips":["-This detail is not part of this quest, but involves a possible bug from freeing a merchant that happens to be near\nthe start of 'Highwayman's Cache'. Just south east of The Boatmaker's Hut, free the Claywich merchant who is \nheld captive. Be careful because this merchant can be bugged. Make a save just before opening his cage, then \nfast travel to Claywich. If the talking option doesn't show up, reload until it does or meditate until daylight. Make \nsure to buy all the gwent cards he has for sale."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:a princess in distress","name":"A Princess in Distress","namePl":"Na ratunek Księżniczce","level":5,"tips":["-During 'A Princess in Distress', you can actually kill the bear ahead of time before you encounter it while \nleading the goat back to the pellar. If you do this, Geralt will have some extra dialogue while leading \nPrincess back."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Princess_in_Distress","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=250530"},{"id":"k:crow s perch fight","name":"Crow's Perch Fight","namePl":null,"level":null,"tips":["-This is the fight you have with the Baron during the huge fire. It is part of the 'Family Matters' questline."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:thou shalt not pass","name":"Thou Shalt Not Pass","namePl":"Przejścia nie ma","level":7,"tips":["-Complete before Fake Papers. Once you have completed 'A Princess in Distress' and have dealt with the \nbotchling, after following the lumberkin, you can go to the Oxenfurt gate when trying to find Tamara (but don't\nproceed to find Tamara yet because you can have a unique interaction with the Baron first), and you can \ntrigger the 'Thou Shall Not Pass' quest. Once you get this quest started, return to the Baron to aquire the \npass from him. Once you do this, then you can do 'Bitter Harvest' and 'Fake Papers', but it is suggested to do \nthese two quests when you are a higher level since you will have to ensure someone is protected and kept alive \nin 'Bitter Harvest'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=thou-shalt-not-pass"},{"id":"k:death by fire","name":"Death By Fire","namePl":"Śmierć w ogniu","level":10,"tips":["-Complete immediately when triggered."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Death_by_Fire","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=death-by-fire"},{"id":"k:looters ii","name":"Looters (II)","namePl":"Szabrownicy","level":null,"tips":["-Secret chest found North East of Codger's Quarry."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:lynch mob","name":"Lynch Mob","namePl":"Samosąd","level":7,"tips":["-Complete before a Favor for a Friend, spare the man being hanged."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:ciri s story the race","name":"Ciri's Story: The Race","namePl":"Historia Ciri: Wyścig","level":5,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Ciri%27s_Story:_The_Race","mapUrl":null},{"id":"k:hunting a witch","name":"Hunting a Witch","namePl":"Polowanie na czarownicę","level":5,"tips":["-During Hunting a Witch, when you speak with the peasant man about Keira's whereabouts, there \nis another way to get the info. Cancel out of the convo, meditate outside of the area and wait for the \nman to start walking. Slowly follow until he is attacked by nekkers, then save him. @1:27."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hunting_a_Witch","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555828"},{"id":"k:wandering in the dark","name":"Wandering in the Dark","namePl":"Po omacku","level":6,"tips":["-During Wandering in the Dark, when you get the eye of Nehaleni, don't go further and don't use it yet because \nthere is another hidden room at the opposite end of the big room. Use aard to break through a wall and then \nyou'll see a hidden area.","-Accept Keira's request at the end of this quest and complete 'Magic lamp' right away."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555829"},{"id":"k:magic lamp","name":"Magic Lamp","namePl":"Zadanie:Magiczny kaganek","level":6,"tips":["-Must be completed right after doing 'Wandering in the Dark'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Magic_Lamp","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=426127"},{"id":"k:races crow s perch","name":"Races: Crow's Perch","namePl":"Wyścigi: Wrońce","level":1,"tips":["-Complete before the Isle of the Mists."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Races:_Crow%27s_Perch","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=races-crows-perch"},{"id":"k:an invitation from keira metz","name":"An Invitation from Keira Metz","namePl":"Zaproszenie od Keiry Metz","level":6,"tips":["-Complete before the Isle of Mists."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/An_Invitation_from_Keira_Metz","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=an-invitation-from-keira-metz"},{"id":"k:a towerful of mice","name":"A Towerful of Mice","namePl":"Mysia wieża","level":6,"tips":["-Complete before the Isle of Mists.","-Mysterious female shadow that appears around Fyke Isle when you are sailing. It does not appear before or after the quest 'A Towerful of Mice', only during. There is also a weird transparent object floating near the boat that can react to igni and you'll hear a male and female scream. It seems the shadow and the transparent object appear when Keira is speaking to you with the Xenovox. The likely explanation is that the developers created an invisible npc that Keira can speak through.","-In 'A Towerful of Mice', you can find a ghostly statue only sometimes and at certain camera angles and appears to be a statue of the virgin Melitele.","-Towerful of Mice quest: The Mage experimented on local people as well as rats.","-In 'Towerful of Mice', before the curse is lifted, all the flames (candles, torches, etc) can not be extinguished.","-In 'Towerful of Mice', the mage Alexander, refers to Keira Metz in his note and calls her 'The Woman'.","-During a Towerful of Mice, there are some details about Graham, the man that lost his love. Inside \nGraham's house, you can find a noose, implying he was going to kill himself soon. He has also built an \naltar for his love inside his hut.","-In a Towerful of Mice, you can talk to a man outside Graham's hut to get more information about him.","-A towerful of mice has 3 haunted spots outside of the tower and 5 inside (one of those 5 being \nrelated to the quest).","-In 'Towerful of Mice', you can get the better ending where Annabelle is laid to rest, without doing any \ninvestigations. If you speak to Annabelle and then say that you need to look around some more, then \ntry and leave the tower, she will lock the door and attack you.","-If you release the pesta in the 'Towerful of Mice', the red miasmal from the 'In the Eternal Fire's Shadow' quest \nwill make a comment regarding this.","-If you didn't go back to see the Pesta killing Graham during a Towerful of Mice, the dialogue between you and \nKeira is slightly altered. If you brought back the bones, the pesta will never disappear from the house and \nyou can't kill it."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Towerful_of_Mice","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=19890"},{"id":"k:a favor for a friend","name":"A Favor for a Friend","namePl":"Przyjacielska przysługa","level":6,"tips":["-Complete before the Isle of Mists.","-Keira Metz quest 'A Favour For A Friend' find a corpse of the driver of the food cart \n(connected with Devil By the Well)."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Favor_for_a_Friend","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=a-favor-for-a-friend"},{"id":"k:for the advancement of learning","name":"For the Advancement of Learning","namePl":"Dla dobra nauki","level":8,"tips":["-Complete before the Isle of Mists, spare Keira and send her to Kaer Morhen.","-For the Advancement of Learning: The best conversation path is to ask about the notes, \"Radovid never \nforgets\", \"It's suicide\", and then the fourth dialogue option will let you suggest Kaer Morhen. If you convince \nher to go to Kaer Morhen, you can then ask for the notes without having to kill her.","-If you take the less ideal ending and send Keira to Radovid at the end of this quest, it will unlock a future quest\nthat would not be available otherwise. This future quest is \"A Final Kindness\", but is once again part of the bad\nending for Keira. Choosing this path will also partially fail the future \"Brothers in Arms: Velen\" quest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/For_the_Advancement_of_Learning","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425990"},{"id":"k:defender of the faith i","name":"Defender of the Faith (I)","namePl":"Obrońca wiary","level":10,"tips":["-Complete before doing 'In the Eternal Fire's Shadow in order to get some unique dialogue during that quest.","-Defender of the Faith can be started at one of two locations, but it is just one quest.","-The 3 different types of statues that you can find around Velen can possibly represent the Goddess Melitele \nin her three forms: a young carefree girl (can be found near the Midcopse signpost or at the second intersection\neast of Blackbough), a mature pregnant woman (one can be found at the first intersection east of Blackbough), \nand a hunched old woman (one can be found north of The Orphans of Crookback Bog signpost, just to the east\nof the burnt/torn down hut). It is possible they can also represent the 3 crones. Based on the quest 'Defender \nof the Faith', the woman that gives you the quest tells you that the statue is of Verna the Merciful. You can also \nsee the three statues on your way to talk to Thecla during 'Bald Mountain'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Defender_of_the_Faith","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=defender-of-the-faith"},{"id":"k:defender of the faith ii","name":"Defender of the Faith (II)","namePl":"Obrońca wiary","level":10,"tips":["-Complete before doing 'In the Eternal Fire's Shadow in order to get some unique dialogue during that quest.","-Defender of the Faith can be started at one of two locations, but it is just one quest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Defender_of_the_Faith","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=defender-of-the-faith"},{"id":"k:a dog s life","name":"A Dog's Life","namePl":"Pieskie życie","level":5,"tips":["-Complete immediately, don't let the dog die, and follow it closely afterwards."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Dog%27s_Life","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=a-dogs-life"},{"id":"k:the fall of the house of reardon","name":"The Fall of the House of Reardon","namePl":"Zagłada domu Reardonów","level":6,"tips":["-Complete before the Isle of Mists.","-Find Dolores's diary and treasure.","-Check out the basement with the breakable wall AFTER completing the quest because you can get \nadditional dialogue with Dolores 2 days later. Visit Dolores at the manor two days after completing the quest \nto get some additonal dialogue and then go in the basement and speak with her again once you've found \nthe skeleton. She will then spend some time in the basement crying in front of the skeleton.","-The skeleton in here might be Dolores's brother and he may have been in love with her.","-Avoid all of Letho's traps to get unique dialogue with him once you meet.","-Find a painting of Dolores and her brother in the house."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=the-fall-of-the-house-of-reardon"},{"id":"k:ghosts of the past","name":"Ghosts of the Past","namePl":"Duchy przeszłości","level":6,"tips":["-Complete before the Isle of the Mists.","-In Ghosts of the Past, you can kill Louis right away after Letho decides to leave him for dead.","-During Ghosts of the Past, when given the choice between \"you're as good as dead\" and \"don't want trouble\" \nyou can hear Letho snoring before selecting the option.","-In 'Ghosts of the Past', choose \"Don't want trouble\" after meeting Vester, then \"his medallions all you need\" so \nyou can send Letho to Kaer Morhen."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Ghosts_of_the_Past","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=282784"},{"id":"k:velen players","name":"Gwent: Velen Players","namePl":"Gwint: Rozgrywki w Velen","level":1,"tips":["-Play the Baron in Gwent before 'Return to Crookback Bog'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Gwent:_Velen_Players","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425993"},{"id":"k:looters iii","name":"Looters (III)","namePl":"Szabrownicy","level":null,"tips":["-How to trigger the third looters marker and where to find the other two @18:20"],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:ladies of the wood","name":"Ladies of the Wood","namePl":"Panie Lasu (zadanie)","level":6,"tips":["-There's a 3rd option to complete the 'Whispering Hillock', but you have to find the tree before starting the \n'Ladies of the Wood'. You can release the spirit this way and still get the good Baron ending.","-The following doesn't have anything to do with this quest, but I thought that I would put it here: Before freeing \nDandelion in the main game, visit the starting point of Blood and Wine to find and loot the drawings of the \nbeast there @9:36 (Stonecutters' Settlement).","-Deleted dialogue with the Brothers in Arms mod where you can defend Anna from the Crones when she is \nspeaking with them through the tapestry during 'Ladies of the Wood'.","-Deleted dialogue with the Brothers in Arms mod where the crones ask Geralt if he fears the woodland beasts \nduring the quest 'Ladies of the Wood'.","-Deleted dialogue with the Brothers in Arms mod where the kids explain their prank to Geralt during the quest \n'Ladies of the Wood'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Ladies_of_the_Wood","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555830"},{"id":"k:the whispering hillock","name":"The Whispering Hillock","namePl":"Szepczące wzgórze (zadanie)","level":5,"tips":["-In the 'Whispering Hillock', just east of the place of power, behind a rock, you can find the body of a kid.","-If you did not release the tree spirit, after first talking to the Crones, go back to Downwarren and \nget some extra dialogue with the man that cut off his ear."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/The_Whispering_Hillock","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=248634"},{"id":"k:ciri s story fleeing the bog","name":"Ciri's Story: Fleeing the Bog","namePl":"Historia Ciri: Ucieczka z moczarów","level":5,"tips":["-In 'Ciri's Story: Fleeing the Bog', Ciri hides in a tree to escape Imlerith. This may be referencing a part of the \nWitcher book, Sword of Destiny, in which Geralt tells Ciri a story about how a tomcat that gets lost in a forest, \nand is chased by a fox and hunters, ends up escaping by climbing a tree."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Ciri%27s_Story:_Fleeing_the_Bog","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555831"},{"id":"k:family matters part 2","name":"Family Matters (Part 2)","namePl":"Sprawy rodzinne","level":5,"tips":["-Part 2 starts once you've found Tamara and Anna.","-A very small quest (A Mysterious Passenger), which is just dialogue, will be missed if you continue. You need \nto do most of the Skellige story first in order to get it, so it is not worth it to do 'A Mysterious Passenger'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Family_Matters","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555363"},{"id":"k:ciri s story out of the shadows","name":"Ciri's Story: Out of the Shadows","namePl":"Historia Ciri: Wyjście z cienia","level":5,"tips":["-You can find the place where Ciri fought the Basilisk in 'Ciri's Story: Out of the Shadows' at the forgotten \ntower west of Heatherton."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Ciri%27s_Story:_Out_of_the_Shadows","mapUrl":null},{"id":"k:in ciri s footsteps velen","name":"In Ciri's Footsteps: Velen","namePl":"Śladami Ciri: Velen","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:return to crookback bog","name":"Return to Crookback Bog","namePl":"Powrót na Krzywuchowe Moczary","level":9,"tips":["-Complete before the Isle of the Mists.","-In the basement, underneath the crone tapestry, you can find unique voodoo dolls that represent people that\nthe crones have cursed, including Anna, a peasant from Downwarren, and Vivienne from the DLC Blood and\nWine quest 'The Warble of a Smitten Knight'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Return_to_Crookback_Bog","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=426126"},{"id":"k:saving farmer s daughter from soldiers i","name":"Saving Farmer's Daughter From Soldiers (I)","namePl":null,"level":null,"tips":["-This is triggered after completing 'Return to Crookback Bog' and going back to Crow's Perch. Check the link to \nthe left to see the approximate location."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:saving farmer s daughter from soldiers ii","name":"Saving Farmer's Daughter From Soldiers (II)","namePl":null,"level":null,"tips":["-This is triggered after completing 'Return to Crookback Bog' and going back to Crow's Perch. Check the link to \r\nthe left to see the approximate location."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:bitter harvest","name":"Bitter Harvest","namePl":"Hieny cmentarne","level":9,"tips":["-Complete this after you have done 'Thou Shall Not Pass'.","-Must be completed when started. Save game before because if Alvin dies, Fake Papers will fail."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Bitter_Harvest","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=bitter-harvest"},{"id":"k:fake papers","name":"Fake Papers","namePl":"Fałszywe papiery","level":1,"tips":["-Complete after Thou Shalt Not Pass and Bitter Harvest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Fake_Papers","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=fake-papers"},{"id":"k:love s cruel snares","name":"Love's Cruel Snares","namePl":"Dama w opałach","level":10,"tips":["-For this quest to become available, you need to clear both the boatyard abandoned site (between Refugees' \nCamp and Condyle) and the pirate base on the peninsula west of it of all pirates.","-In 'Love's Cruel Snares', if you refuse to help the woman, she will venture out herself and ends up getting killed \nby the wild dogs.","-In 'Love's Cruel Snares', once the quest is completed, and you wait a few days, if you go to the spot where the \nman died, you will find the woman and it looks like she is eating the body. This happens to be in an area of \nVelen where there are many cannibals."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the merry widow","name":"The Merry Widow","namePl":"Zlecenie: Kłopoty grabarza","level":10,"tips":["-After the Merry Widow contract is complete, wait a day or 2 and head back to the area you fought the \ngrave hag. You will see 2 statues that change places when you enter and exit the crypt. Their faces \nchange as well the further away you move from them. This is a reference to a Doctor Who episode.","-In order to trigger 'Witcher Wannabe', you must complete 'The Merry Widow' first."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_The_Merry_Widow","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-the-merry-widow"},{"id":"k:witcher wannabe","name":"Witcher Wannabe","namePl":"Wiedźmin jak malowany","level":10,"tips":["-To begin this quest, complete 'The Merry Widow' and then wait at least 5 in game days for 'Witcher Wannabe' \nto appear.","-After Witcher Wannabe, if you lie and DON'T expose him as a wannabe witcher, you can get him to work \noff his failure with the village elder. You can find the wannabe witcher working in a small field at the southern \nentrance (souteast of the signpost) a day or so later. He is still wearing the witcher medallion."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=witcher-wannabe"},{"id":"k:the truth is in the stars","name":"The Truth is in the Stars","namePl":"Wróżbita prawdę ci powie","level":1,"tips":["-During 'The Truth is in the Stars', you can find a 'man killing' rabbit."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=secondary-quest-the-truth-is-in-the-stars"},{"id":"k:fool s gold","name":"Fool's Gold","namePl":null,"level":6,"tips":["-There is a man that you can find in Velen, just north-east of Lurtch. Normally, he will immediately attack you, \nbut if you can get close to his hut while he is still inside, you can see him eating a dead body. He seems to \nhave killed a man, his wife, and their dog, while leaving the fish on the stove untouched and instead, \nconsuming the bodies.","-During Fool's Gold, follow Yontek and you will see him do some magic spells.","-For the quest Fool's Gold, return to the village after the quest is complete to get some rare dialogue about the\ncaretaker from Hearts of Stone.","-During 'Fool's Gold', you can find a symbol in the pig's temple that looks like the symbol the crones placed on \nAnna's hand. This might imply that the crones were involved in the pig curse.","-During 'Fool's Gold', Igor the pig can actually eat the horn of plenty that can potentially be given to you by \nGaunter O'Dimm if you side with him and choose that specific reward during Hearts of Stone."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:wild at heart","name":"Wild at Heart","namePl":"Dzikość serca","level":7,"tips":["-In 'Wild at Heart', if you spare Margrit and kill Niellen, you can receive a key to unlock the chest in the cabin \nupstairs. You can also find Margrit in the cabin crying."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=wild-at-heart"},{"id":"k:forefathers eve","name":"Forefathers' Eve","namePl":"Dziady","level":7,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:a greedy god","name":"A Greedy God","namePl":"Opium dla ludu","level":7,"tips":["-During 'A Greedy God' dispel the ruins around the back and speak to the Allgod before speaking with the \npeasants in order to get additional dialogue. If you spared him, come back to the area 2 days later to find the \npeasants praying and the Allgod grumbling. If you killed him, follow the peasants back to their homes and you \nwill see them praying to another god."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Greedy_God","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=a-greedy-god"},{"id":"k:last rites","name":"Last Rites","namePl":"Ostatnia posługa","level":9,"tips":["-To trigger Last Rites quest, repair the shrines around Velen (Defender of the Faith quest) and appear at night. \nDo not meditate in close proximity. Next to the grave, use Keira's lamp to get a unique scene."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Last_Rites","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=last-rites"},{"id":"k:blood ties","name":"Blood Ties","namePl":"Więzy krwi","level":12,"tips":["-Lena's fate (from the Swallow potion - 'On Death's Bed') is determined in the Nilfgaardian camp."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the volunteer","name":"The Volunteer","namePl":"Ochotnik","level":13,"tips":["-In The Volunteer, Trollolo's painting is actually much better than Geralt's."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=the-volunteer"},{"id":"k:woodland beast","name":"Woodland Beast","namePl":"Potwór z lasu","level":6,"tips":["-If you decide to let the Scoia'tael be, but inform the captain about them, you can later be ambushed by\nVernossiel, the leader of the Scoia'tael group, close to the Glory Gate signpost."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Woodland_Beast","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-woodland-beast"},{"id":"k:patrol gone missing","name":"Patrol Gone Missing","namePl":"Zlecenie: Zaginiony patrol","level":7,"tips":["-There is a Nilfgaardian area called The House of Respite that you can only enter while wearing \nNilfgaardian attire (can be the formal clothes). In this area, there is a section that you can't enter.","-In the House of Respite area in the Nilfgaardian camp, once you get in using Nilfgaardian armor, you can loot a \nchest with more Nilfgaardian armor, as well as a helmet that is next to the chest. This helmet can be put on as a \nmask in the inventory menu, and it appears as a helmet with the Nilfgaardian wings in-game. If you turn on the \nalternative nilfgaardian armor in the main menu option settings, your Geralt will be wearing the Season 1 Netflix \nNilfgaardian Armor set. Is it considered armor? At least it can be worn for a laugh!"],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Patrol_Gone_Missing","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=30633"},{"id":"k:shrieker","name":"Shrieker","namePl":"Zlecenie: Skrzekacz","level":8,"tips":["-In 'Contract: Shrieker', you can talk to the boy, Symko, one final time to grant him some solace after you \ncomplete the quest. If you kill the goats nearby, the boy will temporarily be uninteractable and won't speak \nwith you until you go away and come back."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Shrieker","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-shrieker"},{"id":"k:jenny o the woods","name":"Jenny O' the Woods","namePl":"Zlecenie: Leśnica","level":10,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Jenny_o%27_the_Woods","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-jenny-o-the-woods"},{"id":"k:swamp thing","name":"Swamp Thing","namePl":"Zlecenie: Potwór z bagien","level":12,"tips":["-During the Contract Swamp Thing, you will meet Leslav. He seems to have read a notice about peat and its \ndifferent properties. You can find this notice in the village of Lindenvale in Crookback Bog before speaking with \nhim. After completing the quest, you can find another notice that is looking for peat diggers now that the \nBog is clear."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Swamp_Thing","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-swamp-thing"},{"id":"k:mysterious tracks","name":"Mysterious Tracks","namePl":"Zlecenie: Tajemnicze ślady","level":20,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Mysterious_Tracks","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-mysterious-tracks"},{"id":"k:the mystery of the byways murders","name":"The Mystery of the Byways Murders","namePl":"Zlecenie: Tajemnica wsi Stegny","level":22,"tips":["-In 'Contract:The Mystery of the Byways Murders', you can get different amounts of pay depending on who you \nspeak to first and what you say. To get the most coin, talk to the officer Milan first before going to Bywaters so \nthat you can haggle for more gold. When at the village and after rescuing the two survivors, say 'I'm nosy' to \nBytomir so that he doesn't know you were already hired to take care of the monster since he won't pay you if he \nknows you were hired. Once you kill the monster (after examining the soldiers' bodies, following the scent, and \ngoing into the tunnels under the hut), Bytomir will reward you with 210 coins. You can then return to Milan to \ncollect the reward from him as well."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_The_Mystery_of_the_Byways_Murders","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-the-mysterious-byways-murders"},{"id":"k:phantom of the trade route","name":"Phantom of the Trade Route","namePl":"Zlecenie: Zmora kupieckiego traktu","level":23,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Phantom_of_the_Trade_Route","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=19956"},{"id":"k:missing brother","name":"Missing Brother","namePl":"Zlecenie: Zaginiony brat","level":33,"tips":["-Loot the human body in the last chamber in the western side to get Gwyhyr. The body might be invisible,\nbut you can interact with the pile at the end."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Missing_Brother","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-missing-brother"},{"id":"k:queen zuleyka s treasure","name":"Queen Zuleyka's Treasure","namePl":"Skarb królowej Zuleyki","level":1,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:lost goods","name":"Lost Goods","namePl":"Ukryta przystań","level":1,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hidden_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=treasure-hunt-lost-goods"},{"id":"k:out of the frying pan into the fire","name":"Out of the Frying Pan, Into the Fire","namePl":"Z deszczu pod rynnę","level":1,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hidden_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=treasure-hunt-out-of-the-frying-pan-into-the-fire"},{"id":"k:sunken treasure","name":"Sunken Treasure","namePl":"Zatopiony skarb","level":4,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hidden_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=hidden-treasure1"},{"id":"k:an unfortunate turn of events","name":"An Unfortunate Turn of Events","namePl":"Nieszczęśliwy wypadek","level":4,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hidden_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=treasure-hunt-an-unfortunate-turn-of-events"},{"id":"k:sunken chest","name":"Sunken Chest","namePl":"Zatopiona skrzynia","level":4,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hidden_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=sunken-treasure"},{"id":"k:hidden from the world","name":"Hidden from the World","namePl":"Schowane przed światem","level":7,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hidden_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=treasure-hunt-hidden-from-the-world"},{"id":"k:the dead have no defense","name":"The Dead Have No Defense","namePl":"Umarli się nie bronią","level":9,"tips":["-You can find a man playing the flute in a boat near the docks south of Byways."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the things men do for coin","name":"The Things Men Do For Coin...","namePl":"Czego się nie robi dla złota","level":12,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hidden_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=treasure-hunt-the-things-men-do-for-coin"},{"id":"k:don t play with gods","name":"Don't Play With Gods","namePl":"Nie igraj z bogami","level":15,"tips":["-After clearing the abandoned village in the Mire Landing (Cestersover), you can run into a stuttering character \nfrom the Witcher 1 (South of Byways).","-South of Byways, you can hear some interesting ambient dialogue that is likely referring to the botchling.","-Interesting dead tree south west of Fyke Isle. It has many buried metal faces surrounding it, along with a \nchest that cannot be accessed."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:costly mistake","name":"Costly Mistake","namePl":"Kosztowna pomyłka","level":18,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:blood gold","name":"Blood Gold","namePl":"Krwawe złoto","level":18,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hidden_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=treasure-hunt-blood-gold"},{"id":"k:tough luck","name":"Tough Luck","namePl":"Jak pech, to pech","level":18,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hidden_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=hidden-treasure7"},{"id":"k:a plea ignored","name":"A Plea Ignored","namePl":"Niewysłuchana prośba","level":28,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:dowry","name":"Dowry","namePl":"Wiano","level":32,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:griffin school gear basic","name":"Griffin School Gear (Basic)","namePl":"Poszukiwania: Rynsztunek szkoły gryfa","level":11,"tips":["-Do a Warm Welcome before looking for Witcher George's Griffin diagrams (the peasant you save \nwill tell you where it is).","-In the Abandoned Tower, West of Heatherton, you can find two chests that are somewhat hidden."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Scavenger_Hunt:_Griffin_School_Gear","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425995"},{"id":"k:griffin school part 1","name":"Griffin School Part 1","namePl":"Wiedźmińska szkoła cechu Gryfa","level":18,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:griffin school part 2","name":"Griffin School Part 2","namePl":"Wiedźmińska szkoła cechu Gryfa","level":18,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:forgotten wolf school gear basic","name":"Forgotten Wolf School Gear (Basic)","namePl":"Poszukiwania: schematy ulepszeń zapomnianego rynsztunku Wilka","level":20,"tips":["-This is not technically a quest, as the diagrams for the Forgotten Wolf School Gear (Basic) are given to you \nupon completion of 'In the Eternal Fire'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Forgotten_Wolf_School_Gear","mapUrl":null},{"id":"k:wolf school part 1","name":"Wolf School Part 1","namePl":"Wiedźmińska Szkoła Cechu Wilka","level":21,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:wolf school part 5","name":"Wolf School Part 5","namePl":"Wiedźmińska Szkoła Cechu Wilka","level":34,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:cat school part 2","name":"Cat School Part 2","namePl":"Wiedźmińska szkoła cechu Kota","level":23,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:cat school part 3","name":"Cat School Part 3","namePl":"Wiedźmińska szkoła cechu Kota","level":29,"tips":["-North of Novigrad in a nearby cave, if you use your torch and look up at the end of the cave, you will see a lot \nof cave drawings. These reference the real life Bhimbetka cave drawings."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:playing innkeeps","name":"Gwent: Playing Innkeeps","namePl":"Gwint: Partyjki z karczmarzami","level":1,"tips":["-Play Olivier in Novigrad before 'Now or Never'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:old pals","name":"Gwent: Old Pals","namePl":"Gwint: Starzy znajomi","level":5,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:fists of fury velen","name":"Fists of Fury: Velen","namePl":"Wściekłe pięści: Velen","level":11,"tips":["-You can speak to Fishgulper in front of Lindenvale's inn after the fight in Fists of Fury: Velen and give him \nsome money for his family."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Novigrad/Oxenfurt","steps":[{"id":"k:racists of novigrad i","name":"Racists of Novigrad (I)","namePl":"Rasiści z Novigradu","level":null,"tips":["-Visit crematorium (north of Oxenfurt Gate) at night to have it feel creepier. Listen to more dialogue during the \nday and meet an apothecary that was in the Witcher 2."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:a walk on the waterfront","name":"A Walk on the Waterfront","namePl":"Spacer po nadbrzeżu","level":12,"tips":["-Must be done before Count Reuven's Treasure. Don't let Ginter die.","-Find Odrin at Novigrad's docks @6:06 (Merchant beside him sells 250 empty bottles)."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:warehouse of woe","name":"Warehouse of Woe","namePl":"Przeklęty magazyn","level":13,"tips":["-Complete immediately when obtained."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=warehouse-of-woes"},{"id":"k:strumpet in distress","name":"Strumpet in Distress","namePl":"Kurtyzana w opałach","level":null,"tips":["-Brief interaction between a role playing couple outside the Novigrad docks @4:01 \n(this is time sensitive and will fail once you've passed by the area)."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:racists of novigrad ii","name":"Racists of Novigrad (II)","namePl":"Rasiści z Novigradu","level":null,"tips":["-Complete after 'Racists of Novigrad (I)' and before 'An Elusive Thief'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:karmic justice","name":"Karmic Justice","namePl":"Karmiczna sprawiedliwość","level":null,"tips":["-Complete Karmic Justice before burning down the witch hunter's headquarters with Triss \nduring Count Reuven's Treasure.","-If Karmic Justice isn't triggering, meditate until it's between 10pm and 1am. It may only occur at these times."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:face me if you dare ii","name":"Face Me if You Dare (II)","namePl":"Zmierz się ze mną!","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:drunken rabble","name":"Drunken Rabble","namePl":"Pijany motłoch","level":null,"tips":["-Find the drunk barber in Novigrad @15:30 (He will give you the wrong haircut the first time around)."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:pyres of novigrad","name":"Pyres of Novigrad","namePl":"Stosy Novigradu","level":10,"tips":["-Here are 4 locations in Novigrad that have hidden loot. Just West of the Southern Gate in Novigrad, you can \nfind and loot two hidden chests. North West of Electors' Square, you can find a chest near the rock wall. There \nis a shipwreck West of Hierarch Square where you can find 2 chests and a body to loot. On a small island West \nof Electors' Square, you can loot a chest.","-Armorer in Heirarch Square in Novigrad that says top notch swords now actually sells a few good swords, \ntwo of which are actually in promos and trailers for the game. He'll stop saying \"top notch swords\" once you \nbuy them.","-Find Triss's Witcher 2 outfit in her home as well as writings/paintings outside of Triss's house.","-In Pyres of Novigrad, don't approach too quickly, otherwise you'll miss Menge's speech.","-In Pyres of Novigrad, if you pull out your sword while fighting the looters, they will instantly cower. When you \ngo in the house, you will find the Rose of Remembrance, which is from the Witcher 2.","-In Pyres of Novigrad, you can find scriptures/writings in certain spots outside of the house the looters are at.","-In Pyres of Novigrad, there are 4 beggars you can speak with (the addled one is the only one that knows), \nor you can follow the thieves and get some interesting dialogue (they can lead you into a trap if they know \nyou're following). Follow the thieves to get the location and then you can go back to the beggars to \nget the password.","-In Pyres of Novigrad, you can enter the Putrid Grove through the sewers which gets a key that may not \nbe available after this quest.","-In Pyres of Novigrad, when in the Putrid Grove, there is some interesting ambient dialogue that you can find \nand a good saddle bag.","-It is possible for Geralt to carry around a copy of the Kama Sutra with him if he has the right saddle (Zerrikanian \nsaddlebags). You can also find this book on one of the people you save from the witch hunters on the outskirts \nof Novigrad and on a mage named Carduin. You can buy the Zerrikanian saddlebags from the merchant in the \nPutrid Grove.","-In Pyres of Novigrad, when doing the rat catching with Triss, the merchant will pay the full amount upfront \nsince he believes he will get it back off your corpse.","-Buy jade figurine and lizard figurine from merchant in Gildorf right AFTER meeting Triss for the first time.\nThe lizard figurine can start the 'Of Dairy and Darkness' quest.","-You can get the Elven crossbow from a merchant on the Gildorf market square in Novigrad near St. Gregory's \nBridge (part of the elite crossbow set).","-Before starting 'Carnal Sins', you can meet the dwarf that ends up dead. Try to find him during 'Pyres of \nNovigrad', since the area will be blocked off during 'Carnal Sins' and possibly many quests before it. Also, in \nthis area, you can find an interesting statue and patients that talk about the murder before it happens. They \nwill also talk about the murder at the beginning of the 'Carnal Sins' quest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Pyres_of_Novigrad","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555832"},{"id":"k:suspicious shakedown","name":"Suspicious Shakedown","namePl":"Podejrzany szantaż","level":10,"tips":["-'Suspicious Shakedown' is only available after 'Pyres of Novigrad'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:witch hunter raids i","name":"Witch Hunter Raids (I)","namePl":"Nalot łowców czarownic","level":null,"tips":["-Complete before 'Now or Never' and it is only available AFTER 'Pyres of Novigrad'.","-Witch Hunter Raids, Find unique encounter near Glory Gate @0:45 A bunch of witch hunters \nknocking on a door (Available after the rat catching part of the Pyres of Novigrad quest with Triss, but \nunavailable after you help the mages out of Novigrad).","-Crazy cat lady outside of Novigrad has a diary that can start the hunt for the feline armor. You can follow\nher around and she'll say odd things. She also says she can't sleep and can be found outside at night. If you\nwait until around 10pm, leave the area slightly and come back, you will find a lot of dead rats near all of the cats.","-The schedule of Ciri's performer friends are quite elaborate. Valdo is the first to get up and sits by the bank. \nThe group set up the stage throughout the day before the performance at night.","-Romantic bench outside of Novigrad @2:00 (meditate to see multiple couples come by)."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=248616"},{"id":"k:the flame of hatred i","name":"The Flame of Hatred (I)","namePl":"Płomień nienawiści","level":null,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20033"},{"id":"k:never trust children i","name":"Never Trust Children (I)","namePl":"Nigdy nie ufaj dzieciom","level":null,"tips":["-This quest is proximity sensitive and will fail if you leave the area."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:hidden messages of the nilfgaardian kind","name":"Hidden Messages of the Nilfgaardian Kind","namePl":"Pełna konspiracja","level":8,"tips":["-This quest only appears after doing 'Never Trust Children (I)'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the flame of hatred ii","name":"The Flame of Hatred (II)","namePl":"Płomień nienawiści","level":null,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20033"},{"id":"k:novigrad dreaming","name":"Novigrad Dreaming","namePl":"Sen w wielkim mieście","level":7,"tips":["-If you want the secondary quest 'Haunted House', then you must let Sarah stay in the house.","-If you smoke Sarah out of the house, you will run into her again much later on with Johnny, but you won't be \nable to acces the 'Haunted House' quest. The better option is to let her stay. In case you wanted to watch the \nvideo of her with Johnny later on in the game, check the video link. There are spoilers in the video."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Dreaming","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20030"},{"id":"k:haunted house","name":"Haunted House","namePl":"Nawiedzony dom (Wiedźmin 3)","level":7,"tips":["-This quest can only be triggered if you let Sarah stay in the house during 'Novigrad Dreaming'. You can find the\nnotice a few days later on the notice board in Hierarch Square."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Skellige","steps":[{"id":"k:destination skellige","name":"Destination: Skellige","namePl":"Kierunek - Skellige","level":16,"tips":["-I put this quest here because if you want to do the next quest 'Flesh for Sale', it takes place in Skellige and you \nmust do 'Flesh for Sale' BEFORE starting 'Following the Thread'. Do not start 'The King is Dead - Long Live the\nKing' yet since you want to do 'Hard Times' first. In order to not start this, do the objectives for 'Destination: \nSkellige' up until it asks you to visit the port near Kaer Trolde. After getting the letter during 'Hard Times', then\ncontinue this quest, which leads right into 'The King is Dead - Long Live the King', where you can give the \nblacksmith the letter for the 'Hard Times' quest.","-Destination Skellige, man (Steingrim) that meets you on the shores can survive and be found \nin Kaer Trolde later on. Meet him by the docks. This detail needs to be done immediately, otherwise \nhe will disappear.","-Destination Skellige, find the 1k crowns from the corpse of the captain behind the crashed ship.","-Take the Kaer Trolde elevator in Skellige and find a unique piece of dialogue at the top \nregarding the lift."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Destination:_Skellige","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555842"},{"id":"k:hard times","name":"Hard Times","namePl":"Złe wieści","level":21,"tips":["-Complete Hard Times before meeting up with Yennefer so that you can deliver the item to the \nKaer Trolde Blacksmith while you are doing the 'King is Dead: Long Live the King quest with Yen. This is\ndue to a common glitch that occurs with the blacksmith. You sometimes can not speak to him later\nin the game, but saving and restarting the game can sometimes fix this. \n**It seems in the next gen upgrade, the blacksmith problem has been fixed, so you shouldn't have to do this\nworkaround and can do 'Hard Times' at anytime!**"],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the king is dead long live the king","name":"The King is Dead - Long Live the King","namePl":"Król umarł, niech żyje król","level":16,"tips":["-During 'The King is Dead - Long Live the King', Yennefer will now comment on whether you have a beard \nor whether you don't. Before the next gen upgrade, she would only comment if you had a beard.","-During 'The King is Dead - Long Live the King' quest, Yennefer will leave you two different outfits to try on, but \nshe is actually testing you since she does not like one of them. If you chose the one she doesn't like, she will \nmake a comment.","-During 'The King is Dead - Long Live the King', if you promise Yen that you will not drink at the ceremony, but \nyou do anyways, she will get increasingly annoyed.","-During 'The King is Dead - Long Live the King', before you speak to Yennefer, you can have multiple \nconversations with people. These include: Cerys and the group as well as Cerys alone if you catch her after\nher argument with Hjalmar, a pair of widowers, Holger Black Hand with Birna as well as Holger alone, Udalryk \nand Hjort, and Donar an Hindar and Madman Lugos together as well as each separately.","-During 'The King is Dead - Long Live the King' quest, if you let Cerys win the race, there is an amusing scene, \nespecially if you stray from the path.","-During 'The King is Dead - Long Live the King' quest, if you let Madman Lugos win the fistfight, there is a \nunique scene that plays.","-When you are given the key to Yennefer's room in Skellige, it no longer says 'Common item'. It says \n'Relic' instead.","-During 'The King is Dead: Long Live the King', you have an opportunity to speak with the Kaer \nTrolde Blacksmith while escorting Yen (sometimes not interactable for PC players. You can try \nmeditating to also interact with him or saving, then loading).","-During 'The King is Dead - Long Live the King' quest, if you have the Brothers in Arms mod installed, you can \nget a unique cutscene while fighting the 'stuffed' animals. This unique scene is if you 'die' during the \nhallucinated fight.","-You can get the Skellige crossbow from the blacksmith at Kaer Trolde (part of the elite crossbow set).","-In Skellige, you can buy maps that give you fast travel locations on the bigger islands. There are 6 that are \nsold by the merchant west of Kaer Trolde Harbor.","-You can find sitings of 2 abandoned ships on some of the smaller islands of Skellige. When located, if you \nmeditate for 2 whole days, the ships will actually move to the shore.","-The blacksmith in Kaer Trolde will keep telling you information on different swords, 3 in total, if you \nkeep selecting 'tell me a story about one of these weapons'.","-Deleted character with the Brothers in Arms mod where you can meet someone named Whistling Wacker \nnear the docks of Kaer Trolde."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/The_King_is_Dead_-_Long_Live_The_King","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=555843"},{"id":"k:flesh for sale","name":"Flesh for Sale","namePl":"Szemrane interesy","level":12,"tips":["-Complete before starting 'Following the Thread' (Lambert's quest).","-In 'Flesh For Sale', follow the guard to the captain after agreeing that you are the person sent by the \nNilfgaardian in order to not get a red x for the quest objectives. Once at the captain, you can either continue \ngoing along as a Nilfgaardian, or you can reveal who you really are. Either way, you won't have any red X's \nunless you revealed yourself at the gate."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Novigrad/Oxenfurt","steps":[{"id":"k:broken flowers","name":"Broken Flowers","namePl":"Zepsute kwiaty","level":11,"tips":["-Speak to Zoltan about the different women once you have read Dandelion's planner, but before talking to \nany of the women. There is extra dialogue when doing this.","-When meeting with Vespula during 'Broken Flowers', if you run away once the bandits start attacking, when \nyou return, Vespula will be bloodied up and will have a unique scene.","-In 'Broken Flowers', make sure to win both fights against Rosa in order to trigger the 'Fencing Lessons' quest.","-During 'Broken Flowers', when picking a horse, choose the gray mare (Cantarella), and you will get a r
