null,"mapUrl":null},{"id":"k:take what you want","name":"Take What You Want","namePl":"Bierz co chcesz","level":25,"tips":["-This quest is only available if you decide to spare Gaetan in 'Where the Cat and Wolf play'.","-During 'Take What You Want', when you go to Gaetan's place and examine his belongings, you find trophies \non the wall. Geralt comments that these might have been from other rewards in which Gaetan was scammed, \nimplying he may have killed others.","-When you open the chest during 'Take What You Want', you can loot a sword, coin, and a note from another \nwitcher from the School of the Cat. The note states that everyone else from the school of the cat is dead, \nexcept for, possibly Schrödinger, who may or may not have lived (clear reference to the cat of Schrödinger \nexperiment). It also mentions that soldiers have taken over the school and warns Gaetan to avoid cities due \nto bounties placed on their heads."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Novigrad/Oxenfurt","steps":[{"id":"k:final preparations","name":"Final Preparations","namePl":"Ostatnie przygotowania","level":1,"tips":["-Let Ciri go and talk to the sorceresses alone if you want the good ending for the main game."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Final_Preparations","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=155396"},{"id":"k:it takes three to tango","name":"It Takes Three to Tango","namePl":"Serce nie sługa","level":28,"tips":["-Only available if you romance both Triss and Yen. Here is the video of the quest if you want to see it."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the price of passage i","name":"The Price of Passage (I)","namePl":"Cena przejścia","level":null,"tips":["-To get all 3 'The Price of Passage' quests to trigger, you must do the following: You have to give the coin to the \nguards the first time during the \"drunk\" section of 'Contract: The Oxenfurt Drunk'. Refuse to pay the second time, \nand then you can encounter them again a third time East of Oxenfurt. Wait a few days between each encounter \nto trigger the next one. The last encounter might only be at night.","-This can be found during the 'drunk' section of 'Contract: The Oxenfurt Drunk'. Give the coin to the guards for\nthis quest if you want 'The Price of Passage (II)' to trigger."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the oxenfurt drunk","name":"The Oxenfurt Drunk","namePl":"Zlecenie: Pijak z Oxenfurtu","level":26,"tips":["-During the Oxenfurt Drunk, you will meet 2 soldiers. You can meet them a second time after the \nquest is over. @9:54. Make sure to meet the 2 soldiers right after Geralt sings in the first highlighted section. \nThey are West of the first highlighted section and the event is the chance encounter \"The Price of Passage (I)\". \nYou can likely trigger it after the quest, but I have not tried.","-Oxenfurt, start Rough Neighbourhood, at night and after the Oxenfurt Drunk Contract. \nDo not use your sword, or the quest will not continue properly."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_The_Oxenfurt_Drunk","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-the-oxenfurt-drunk"},{"id":"k:the price of passage ii","name":"The Price of Passage (II)","namePl":"Cena przejścia","level":null,"tips":["-The \"drunk\" section of 'Contract: The Oxenfurt Drunk' must be completed before this quest becomes available.\nIf you want 'The Price of Passage (III)' to trigger, refuse to pay the guards this time."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the price of passage iii","name":"The Price of Passage (III)","namePl":"Cena przejścia","level":null,"tips":["-The \"drunk\" section of 'Contract: The Oxenfurt Drunk' must be completed before this quest becomes available.\nThis quest may only appear at night. Finish fighting the soldiers with your fists."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:rough neighborhood","name":"Rough Neighborhood","namePl":"Niespokojna okolica","level":10,"tips":["-Available after 'The Oxenfurt Drunk'. Complete immediately. It happens around midnight.","-Oxenfurt, Rough Neighbourhood, continued after a day or so, @1:51, you'll be ambushed and the \nwoman will help if you escorted her home."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:blindingly obvious","name":"Blindingly Obvious","namePl":"Najciemniej jest pod latarnią","level":28,"tips":["-If you haven't given Triss her earring back, do it during 'Blindingly Obvious' by talking with her as you are \nwalking to the bathhouse. The earring can be found at Kaer Morhen and is in a separate detail.","-During 'Blindingly Obvious', while Triss is casting a spell in the water of a fountain, you briefly see a house. \nThis is supposed to be a place that Triss sees her and Geralt living in sometime in the future. This house can \nactually be found just west of Cunny of the Goose. You can even see Geralt and Triss on the bench in the \nwater's reflection. The loot inside the house even changes after the end of the game. You can loot a candle \nand a pipe, which Triss and Geralt had brought up in previous conversations.","-When talking to Dijkstra and Phillipa, choose all the first dialogue choices.\nDo not injure Dijkstra if you want to do 'Reason of State'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blindingly_Obvious","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=155387"}]},{"region":"Skellige","steps":[{"id":"k:skellige s most wanted","name":"Skellige's Most Wanted","namePl":"Zlecenie: Najgroźniejszy potwór na Skellige","level":29,"tips":["-Show proof that you have helped monsters to get Nekker hide boots. To do this, make sure to complete the\nlisted quests near the end of the walkthrough section in the provided link and make the correct decisions.","-During 'Skellige's Most Wanted', you can negotiate for the highest rate because the man is actually a doppler \nand believes he'll get the money back anyway."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Novigrad/Oxenfurt","steps":[{"id":"k:reason of state","name":"Reason of State","namePl":"Racja stanu","level":30,"tips":["-Don't beat up Dijkstra while rescuing Philippa during 'Blindingly Obvious' in order to get this quest. 'Reason of\nState' needs to be completed before 'On Thin Ice'.","-In Novigrad, just south of St. Gregory's Bridge, there is a well hidden drawing on a hard to reach wall that \nshows a soldier pointing his finger forward, with the message 'CDPR Needs You!'. This can likely only be \nreached using console commands."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=155392"},{"id":"k:the creature from the oxenfurt forest","name":"The Creature from the Oxenfurt Forest","namePl":"Zlecenie: Bestia z Oxenfurckiej Puszczy","level":35,"tips":["-'Contract: Creature from Oxenfurt Forest', make sure to loot the letter to show the guard in the quest to get\nsome unique dialogue. He will be the same guard that ends up holding Quinto prisoner in Hearts of Stone.","-Do 'The Creature from Oxenfurt Forest' quest before 'the Heist'. If you showed the guard holding Quinto the \nnote that you found, he will be extra annoyed when you meet him again during 'The Heist'.","-North East of the Herbalist's Hut near Oxenfurt, you can find an assortment of large stones that are somewhat \nsimilar to Stonehenge. There is also an image of a hanged witch on one of the rocks."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the great escape","name":"The Great Escape","namePl":"Wielka ucieczka (Wiedźmin 3)","level":28,"tips":["-In 'The Great Escape', you can free all the other prisoners once you get the key. You have to do this before \ntalking to Margarita for the second time."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Final_Preparations","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=155396"},{"id":"k:payback","name":"Payback","namePl":"Wyrównanie rachunków","level":28,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Final_Preparations","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=155409"},{"id":"k:through time and space","name":"Through Time and Space","namePl":"Przez czas i przestrzeń","level":26,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Final_Preparations","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=155397"}]},{"region":"Skellige","steps":[{"id":"k:battle preparations","name":"Battle Preparations","namePl":"Przygotowania do bitwy","level":28,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Battle_Preparations","mapUrl":null},{"id":"k:the sunstone","name":"The Sunstone","namePl":"Słoneczny Kamień","level":28,"tips":["-During 'The Sunstone', if you want to complete both objectives, go to Eyvind first and mention Ermion. \nHe will refuse to help you and then you can go to the pearl divers. This will still result in all objectives \nhaving checkmarks.","-In the quest 'The Sunstone', when you are talking to Fishlung and his companion (the divers in the \nunderwater cave), if you don't mention the extra dialogue option about the drowners, then you will be \nambushed by the creatures and Fishlung and his friend can die in the process."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/The_Sunstone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=213880"},{"id":"k:veni vidi vigo","name":"Veni Vidi Vigo","namePl":"Fringilla Vigo (zadanie)","level":28,"tips":["-In 'Veni Vidi Vigo', if you approach by boat, Geralt will have some unique dialogue."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Veni_Vidi_Vigo","mapUrl":null},{"id":"k:child of the elder blood","name":"Child of the Elder Blood","namePl":"Dziecko Starszej Krwi","level":31,"tips":["-During 'Child of the Elder Blood', while in Avallac'h's lab, you can find an invisible note to pick up. In the next\ngen edition, it seems like this has been fixed and the note now appears on the table.","-In the laboratory, say \"Go for it\" if you want to get the good ending for the main game. Also, go to the grave \nwith Ciri if you want the good ending."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Child_of_the_Elder_Blood","mapUrl":null},{"id":"k:skjall s grave","name":"Skjall's Grave","namePl":"Grób Skjalla","level":28,"tips":["-Here's a unique scene that was removed from the game, but can be seen here due to a mod. It is during \n'Skjall's Grave' and is with Ciri on the way to the gravesite."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Skjall%27s_Grave","mapUrl":null},{"id":"k:on thin ice","name":"On Thin Ice","namePl":"Na cienkim lodzie","level":30,"tips":["-'On Thin Ice' quest, before final battle, before speaking to Avallac'h when ready to fight, go behind the \narea to see Ciri levitating stones.","-'On Thin Ice', try to find the crabs around the camp. May not be there anymore according to xLetalis.","-'On Thin Ice' quest, before final battle, before speaking to Avallac'h when ready to fight, take the \nlong way through the cave to find a chest.","-Deleted dialogue with the Brothers in Arms mod where Ciri speaks with one of the wild hunt warriors during \n'On Thin Ice'.","-Deleted dialogue with the Brothers in Arms mod between Eredin and Crach during 'On Thin Ice'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/On_Thin_Ice","mapUrl":null},{"id":"k:tedd deireadh the final age","name":"Tedd Deireadh, The Final Age","namePl":"Tedd Deireadh, Czas Końca","level":30,"tips":["-At the end of the game, during 'Tedd Deireadh, The Final Age', after defeating Eredin, if you look up, you can \nsee the planet that Geralt's world is conjoining.","-During 'Tedd Deireadh, The Final Age', Yennefer will have a unique reaction if you refuse to take one of the \nhorses before heading towards Avallach. It occurs between taking the horses and the fighting giants, so you \nhave to take your time, otherwise you'll miss the dialogue.","-Deleted quest where Emhry arrests the Lodge of Sorceresses."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Tedd_Deireadh,_The_Final_Age","mapUrl":null}]},{"region":"White Orchard","steps":[{"id":"k:faithful friend","name":"Faithful Friend","namePl":"Wierny przyjaciel","level":30,"tips":["-This is only available during the Empress ending."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Faithful_Friend","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/white-orchard?marker=180894"},{"id":"k:something ends something begins","name":"Something Ends, Something Begins","namePl":"Coś się kończy, coś się zaczyna (zadanie)","level":30,"tips":["-Follow the Isle of Mists dwarves at the very end of the game to watch them try and dig up \na place of power.","-During the worst ending of the game, you can find Weavess doing something in her hut. She is weaving a \ntapestry and you can return to look at it closer after the ending is complete. The secret that was found is that \non the tapestry is the location of the tower that you last saw Ciri before she went through the portal. You can \nsee a Swallow (a bird) flying away from the tower, which can be interpreted as Ciri surviving the White Frost.","-There is some rare dialogue during the Empress ending when speaking with Dandelion. His dialogue \nchanges in 3 different ways depending on whether you helped complete Carnal Sins or not.","-This video shows what happens to Tomira, the herbalist, if Radovid ends up ruling in the end. You can rescue\nher as she's burning at a pyre and her hut is being burnt to the ground.","-This video shows the gameplay for all 3 of the major endings of the game.","-This video shows all the ending variations that are possible (Skellige's ruler, Novigrad and Velen ruler, Ciri and\nGeralt endings, Bloody Baron, Sara the godling, Keira Metz, Whoreson Junior, and the mages).","-Cut quests that involve boat racing in the Witcher 3.","-Deleted characters with the Brothers in Arms mod where you can meet the racemasters in Oxenfurt during the \ncut boat races content of the game.","-Deleted characters with the Brothers in Arms mod where you can meet the racemistress in Novigrad during \nthe cut boat races content of the game.","-Deleted characters with the Brothers in Arms mod where you can meet the racemasters in Skellige during \nthe cut boat races content of the game.","-New modded quest called 'In Honor of Essi Daven'","-Another modded quest called The Spider and the Wolf.","-This video shows the original story and endings of the Witcher 3 from 2012 (A Time of Sword and Axe). This \nis part 1 of a video series.","-This is the part 2 video that shows the original story and endings of the Witcher 3 from 2012 (A Time of \nSword and Axe).","-This is the part 3 video that shows the original story and endings of the Witcher 3 from 2012 (A Time of \nSword and Axe).","-This is the part 4 video that shows the original story and endings of the Witcher 3 from 2012 (A Time of \nSword and Axe)."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Hearts Of Stone","steps":[{"id":"k:evil s first soft touches","name":"Evil's First Soft Touches","namePl":"Miłe złego początki…","level":32,"tips":["-There's a missable bandit camp right as you start Hearts of Stone. After the shipwreck when Geralt is fighting\nthe Oferi soldiers and the mage on the beach, if you skip the fight and run and let all of them live, when you \nreturn later after speaking to Olgierd, a bandit camp will have appeared. It's just east of Crane Cape. In the\nvideo, it shows after leaving the area, that the optional objective of defeating the warriors will disappear. Once\nyou return later in the DLC, then you can see the bandit camp all set up and face off against the warriors and\nOfieri mage. There are some lootables inside the tent. There isn't a camp if you kill the warriors right after\ngetting off the ship.","-Don't do the bandit camp north of Vikk Watchtower point of interest quite yet if you want some unique dialogue\nlater on. Once you begin 'Dead Man's Party', you can take Vlodimir to this question mark and he will give some\ndialogue. More information about this is in the corresponding detail found in 'Dead Man's Party'. If you already\ncompleted the point of interest, Vlod will just have a bit of glitched dialogue in that particular area if you take him\nthere.","-You can find the ship that crashed afterwards.","-Deleted dialogue available with the Brothers in Arms mod where there are extra lines from Olgierd during the \nduel in the quest 'Evil's Soft First Touches'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Evil%27s_First_Soft_Touches_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20085"},{"id":"k:dead man s party","name":"Dead Man's Party","namePl":"Hulaj dusza!","level":33,"tips":["-Make sure to complete 'The Cursed Chapel' during 'Dead Man's Party' in order to get unique dialogue from\nVlodimir. Also complete 'A Midnight Clear' with Shani before leaving the wedding area.","-During Dead Man's Party, there are more places where Vlodimir's ghost will appear and say some dialogue. \nInside the tomb, you can break some part of the wall and find a grave robber. Vlod will make a comment.","-Vlodimir's ghost will comment if you go deeper inside the crypt when you find some spiders.","-Vlod's ghost will react to Geralt approaching a certain coffin in the crypt. He reacts if you loot it as well. This is \nin an area right after the spiders. If you trigger the dialogue in the beginning section of the crypt, it won't play \nthe second part of the dialogue when you loot something, so do the area after the spiders with Vlod's ghost first \nin order to get the full dialogue.","-When you are out of the crypt, Vlod's ghost will ask about life as a witcher.","-When leaving the main outside gate of the crypt, Vlod will ask about witcher signs.","-Return to the Everec Estate main gate before going to the wedding and Vlodimir will make another comment.","-When you start riding Roach, Vlodimir will make another comment.","-Vlodimir will make a comment when you ride past the windmill in Brunwich.","-Vlod will comment after certain fights. If you defeat the draconids wouth-west of the Von Everec Estate or \ndefeating the wraiths at the cursed chapel east of the wedding spot. They are the same reaction.","-Vlod will react when fighting powerful monsters like the cursed mother inside the cursed chapel. I've also had \nhim say something different when fighting the cursed mother. He sometimes says, \"Fat F***ing Beast.\"","-Vlod will also react when seeing the draconid nest at the Draken Hollow Outpost, even if you've already\ncleared it.","-Vlod will have some more comments when you first enter the cursed chapel.","-It seems to always be stormy around the cursed chapel.","-Vlod has unique dialogue when fighting the bandit camp north of Vikk Watchtower. He will also make a \ncomment on the fisstech in the same location. If you've already done the bandit camp, Vlod's dialogue \nwill kind of be there, but the audio cuts out and there might be a combined mash up of the two dialogues.","-If you go too far away from the wedding, Vlod's ghost will show up to stop you from going any further.","-Shani possibly posted a notice by the Seven Cat's notice board that requests a beau to a friend's wedding.","-In 'Dead Man's Party', some of the wedding guests refer to an incident where they saw a witcher use axii on a \nroad robber and forced him to shoot his friend with a crossbow and then hang himself. This is the story that \nLambert tells Geralt during 'The Final Trial'.","-Lose the Gwent match to obtain the Ass ears (you do not get a card for winning). If worn, everyone at the \nwedding will comment on them, so you should do this right away. You don't gain a card if you win anyways.","-When fishing for Shani's shoe, leave the area before finding the shoe to get a cutscene. If you find all 3 shoes,\nGeralt and Shani will have some extra dialogue.","-In 'Dead Man's Party', you can loot the fire swallower's cap when following his trail. You can then return it to him \nwhen given the dialogue choice. If you decide to keep it, it stays in your inventory, but you can't wear it.","-In 'Dead Man's Party', if you don't insult the fire-eater, you can eventually watch him perform in front of the \nkids. The third time he breathes fire, he catches himself on fire.","-Insult the fire-eater at the wedding so he leaves. Then entertain the guests in his stead by juggling in the center.\nTo do this, do the following: Choose: 'Fire eating - what's the trick?', then: 'Do what you want.' When you return,\nchoose 'Perhaps I can be of service?'.","-Don't use Axii while pig herding to get the King of Swineherd's crown.","-Sometime after the wedding ends, visit Vlod's grave and you will see flowers placed there by Shani. Geralt\nalso makes a comment.","-'A Midnight Clear' will fail if not completed before leaving the area of the wedding during 'Dead Man's Party'.","-From 'Dead Man's Party', there has been a theory that when Gaunter O'Dimm is eating the apple, he is \nactually taking bites from the back of Vlodomir's head. This doesn't actually appear to be true though since \nVlod has this scar on the back of his head long before you get to that final scene. It may even be from how \nhe died.","-Deleted content available with the Brothers in Arms mod. Extra scenes at the wedding in Hearts of Stone \nwhere you don't ever retrieve Shani's boots. There is also a bit of dialogue that Geralt says before diving in \nto retrieve the boot that was removed from the main game. After meeting the newly weds at the wedding, \nanother deleted scene shows Vlodomir leaving Geralt's body and tries to grab a mug of ale."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Dead_Man%27s_Party_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=426136"},{"id":"k:the cursed chapel","name":"The Cursed Chapel","namePl":"Przeklęta kaplica","level":34,"tips":["-Complete this during 'Dead Man's Party' to get unique dialogue from Vlodimir.","-In 'The Cursed Chapel', the tree behind where Ornesta was likely buried, has a tree branch that has been cut. \nThis may be the branch that she hanged herself from. You can also find the 3 skeletons of the daughters by the \npool of water in the center of the area.","-Southwest of the Upper Mill in Toussaint, in a house close to the Cursed Chapel, there is a wooden beam \nwith carved initials in it. The initials are C + H, but it is uncertain who this could be referring to, unless it was \nCiri and Hjalmer."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=hidden-treasure8"},{"id":"k:a midnight clear","name":"A Midnight Clear","namePl":"W księżycową jasną noc","level":33,"tips":["-'A Midnight Clear' must be done before leaving the wedding area during 'Dead Man's Party'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Midnight_Clear_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=426137"},{"id":"k:viper armour set","name":"Viper Armour Set","namePl":"Poszukiwania: rynsztunek szkoły żmii","level":34,"tips":["-Purchase Viper armor sets from the Countess at the auction house.","-Here is a video link showing all the dye options for the Viper School Gear."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:venomous viper steel sword","name":"Venomous Viper Steel Sword","namePl":"Jadowity stalowy miecz cechu żmii","level":34,"tips":["-This is found in the vault during 'Open Sesame'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:open sesame part 1","name":"Open Sesame! Part 1","namePl":"Sezamie, otwórz się!","level":34,"tips":["-Do 'The Creature from Oxenfurt Forest' quest before the Heist, and show the guard holding Quinto the note \nthat you found. He will be extra annoyed when you meet him again during 'The Heist'.","-Make one of the guards at the auction house sing by selecting specific dialogue @10:27.","-The Goblet of Fire that is on display during 'Open Sesame!: Part 1' references Harry Potter.","-Get the Viper School Gear Diagrams from Countess Mignole at the auction.","-Win the Gaunter O'Dimm card from Hilbert during 'Open Sesame! Part 1'.","-Ewald Borsodi is at the auction house.","-The artist Van Rogh (you can buy their artwork at the auction), is actually Iris. When speaking with the art\nexpert before the auction, the correct answer is the painting of a merchant. He will then give you a tip to buy\nthe Van Rogh painting and that painting is needed to begin 'Avid Collector'.","-During the auction, if you choose 'Nah. I'll wait in the back.', Geralt will be shown feasting at the buffet.","-Buy all items at the auction.","-Bird at the auction can be disassembled and will start a quest. The painting will start another quest and can be \nsold for a trophy in a jar.","-The spectacles sold at the auction belong to the Professor who was the villain in the first game.","-FInd a boar with an arrow through it @28:04 then follow tracks to find the hunter's corpse. This is triggered \nduring 'Open Sesame' when you need to meet the stranger at the Herbalist's hut, but you can't fast travel. You \nmust walk to the hut in order for this to trigger.","-Wear a mask before going to the heist meeting to get a unique line of dialogue from Eveline and Ewald.","-In the basement before the heist, you can see the pictures of all the potential recruits. Triss's face can \nbe seen there, crossed out."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=426135"},{"id":"k:open sesame the safecracker","name":"Open Sesame: The Safecracker","namePl":"Sezamie, otwórz się: Kasiarz","level":34,"tips":["-The fate of Quinto and Casamir if not recruited: Quinto's cage can be found broken, showing he \nescaped and Casamir still blew himself up.","-When approaching Casamir, without triggering the cutscene, you can throw a bomb where he's sitting atop the \nroof and the whole house will go up in flames.","-Ways to enlist Casamir without him blowing himself up:  'Set the torch aside. Let's talk this out.', then 'Forget \nabout it. Got a job for you.', then 'Doubt you're fit to work, anyway.' OR you can use the level 2 delusion ability \nOR you can choose the following: 'Set the torch aside. Let's talk this out.', then 'Actually, got no reason to live. \nBlow yourself sky high.' OR choose the following: 'You're pathetic.'","-If you let Casamir defeat you in the fist fight, there is a funny cutscene."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:open sesame breaking and entering","name":"Open Sesame: Breaking and Entering","namePl":"Sezamie, otwórz się: Włamywacz","level":34,"tips":["-One of these heist recruitments will be found drowned in a lake."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:open sesame witcher seasonings","name":"Open Sesame: Witcher Seasonings","namePl":"Sezamie, otwórz się: Wiedźmińskie przyprawy","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:open sesame part 2 the heist","name":"Open Sesame! Part 2: The Heist","namePl":"Sezamie, otwórz się: Kasiarz","level":null,"tips":["-During 'Open Sesame: The Heist', the dwarf, Casamir, is the only option that won't wait for a decision to \nbe made with the hostages.","-In 'Open Sesame: The Heist', Casamir is the only one you can part on good terms after the quest is done.","-For 'Open Sesame: The Heist', having Quinto in your group is the only way to succeed in the hostage \nnegotiation. Casamir's explosion will always trigger a fight, but will take out the mechanism for the floor trap.","-You can find another large map of the Witcher world in the herbalist's basement during \n'Open Sesame Part 2: The Heist'.","-For 'Open Sesame: The Heist', In order to succeed when negotiating with the hostages: You must have Quinto \ninstead of Casamir, choose 'Pull back from the auction house', 'Bring us a wagon and horses', 'Doesn't matter, \nas long as it rolls', 'I'll set one free now. The rest later.' OR you can do the following: 'Pull back from the auction \nhouse', then 'Tell me a joke', then 'You a racist, Reginald?' OR 'Actually kind of funny.' and they will not attack.","-During 'The Heist' quest, there are a few more references that can be found. You can find a gauntlet with large \ncoins attached to it and it looks similar to the Infinite Gauntlet that Thanos uses in the Marvel movies and \ncomics. You can also find a sword placed in a stone, referencing Excalibur. You can also find an interesting \nlooking effigy.","-Get the Viper Venomous Steel Sword Diagram in the vault before leaving.","-'Open Sesame: The Heist' scene where Geralt tries to pick up Borsodi's house, but lights the candles instead \nis making fun of the fact that when looting things, sometimes you accidentally light the candles that are nearby \ninstead of opening up the chest.","-The masks of the other three heist participants can be looted from the basement of the herbalist hut after \ncompleting 'Open Sesame!'. It may depend on the outcome of the quest.","-After the 'Open Sesame!' quest, go back to the area you fired the crossbow and met Eveline, and loot the \nchest underneath. You'll find the concealment diagram to combine the professor's glasses and donkey ears).","-Deleted scene available with the Brothers in Arms mod where Olgierd is smoking a pipe when bringing him \nMax Borsodi's house."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:a dark legacy","name":"A Dark Legacy","namePl":"Mroczne dziedzictwo","level":34,"tips":["-Bird at the auction can be disassembled to start this quest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Dark_Legacy_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=932509"},{"id":"k:avid collector","name":"Avid Collector","namePl":"Kolekcjoner","level":34,"tips":["-When speaking with the art expert at the auction, choose the merchant painting and he will tell you some \nimportant information about the painting that is put up for auction. You must then buy the painting at the auction \nin order to start this quest.","-In 'Avid Collector', It is possible to both keep the painting and complete this quest. Wait until you have \nCorvo Bianco unlocked in the Blood and Wine expansion and simply hang it up in Corvo Bianco then go \ntalk to Marcus who'll buy it from you, completing the quest. The painting will still be hanging back in Corvo \nBianco.","-In 'Avid Collector', you'll get a conserved shaelmaar trophy and 500 coins. The merchant will also hang the \npainting up on the top floor after waiting a couple of days."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Avid_Collector","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=426138"},{"id":"k:scenes from a marriage","name":"Scenes From a Marriage","namePl":"Żyli długo i szczęśliwie","level":35,"tips":["-In 'Scenes From A Marriage': There are 7 memories in total. The one at the beginning, under the gazebo, is \nmissable and needed for the trophy if you want it.","-During Scenes from a Marriage, there is a quote from a certain painting referencing \nLev Tolstoy's Anna Karenina @6:43.","-Loot some gear in Iris's bedroom (ornate robe and boots).","-If you don't put Iris and Olgierd's painting on her grave, you can keep it and hang it in Corvo Bianco during the \nBlood and Wine expansion.","-Iris's greatest fear actually relishes in being set on fire. The real Olgierd does not behave this way.","-A detail about who the cat and dog's true form might be from 'Scenes of a Marriage'","-Deleted content available with the Brothers in Arms mod that can be found during the 'Scenes from a \nMarriage' quest and involves Olgierd killing his neighbours and wife's father."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=426139"},{"id":"k:venomous viper silver sword","name":"Venomous Viper Silver Sword","namePl":"Jadowity srebrny miecz cechu żmii","level":36,"tips":["-During Gaunter's riddle at the end of the expansion @7:14."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:whatsoever a man soweth","name":"Whatsoever a Man Soweth","namePl":"Kto sieje wiatr…","level":36,"tips":["-Here is a video link on how to get each of the Hearts of Stone endings.","-When talking to the blind professor just before the ending of 'Whatsoever a Man Soweth', extinguish \nthe candles around the pentagram to hear a voice.","-Make sure to visit Shani again after talking with Professor Shakeslock in order to get a Gwent card from her.","-Here is a link to a map of 'Gaunter's World' if you choose to save Vlodimir. If you are quick, you can get to each\nof the points of interest in time.","-In 'Whatsoever a Man Soweth', if you side with Gaunter and choose 'Make me rich', the reward is now doubled \nin the next gen upgrade (10k instead of 5k).","-If you side with Gaunter O'Dimm in 'Whatsoever a Man Soweth', and it is before you have found Ciri, he can \ngive you information on how best to help her (how to get the good ending).","-All Gaunter O'dimm rewards in this video if you side with Gaunter.","-Caparison of Lament saddle from Gaunter can allow Roach to fight with you and she possesses enemies.","-Unique game over scene at the end of Hearts of Stone during 'Whatsoever a Man Soweth'.","-After your encounter with Gaunter O'Dimm at the temple during the end of the game, you can slide down the \ncliffside to the beach and find a dead body that slightly resembles Gaunter. However, it has been disproven by \nxLetalis for various reasons, including the fact that you can find the corpse before the ending of Hearts of Stone.","-On Bird Island (small island directly east of Toderas) you can find a corpse next to a whale skeleton.","-Deleted content available with the Brothers in Arms mod. Alternate possible endings in Hearts of Stone where \nit is possible for Shani to die."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=426140"},{"id":"k:enchanting start up costs","name":"Enchanting: Start-up Costs","namePl":"Zaklinanie: Na dobry początek","level":32,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Enchanting:_Start-up_Costs_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=267624"},{"id":"k:enchanting quality has its price","name":"Enchanting: Quality Has Its Price","namePl":"Zaklinanie: Jakość kosztuje","level":32,"tips":["-Pay the runewright 10,000 coin to get the 2nd level of rune crafting.","-Pay the runewright 15,000 coin to get the 3rd and final level of rune crafting."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Enchanting:_Quality_Has_Its_Price_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=267623"},{"id":"k:the taxman cometh","name":"The Taxman Cometh","namePl":"Płać i płacz","level":32,"tips":["-Tax collector in Oxenfurt will speak with you if you have 35k plus in your inventory."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425985"},{"id":"k:without a trace","name":"Without a Trace","namePl":"Bez śladu","level":32,"tips":["-During 'Without a Trace', make sure to check behind the home of the two villagers to find out the true ending.","-'Without a Trace' has multiple endings depending on if you spare or kill the couple and whether you tell the \nother halfling the truth or lie to him. When the quest is over, upon returning to Erde later, a few different things \ncan happen depending on your choices: If you didn't find Folkert's body, everything will be the same. If you \nkilled the couple, you'll see alghouls and Geralt will remark on this being a fitting situation. If you spared the \ncouple and lied to Otto, you'll see the husband grieving for his wife who died of hunger. If you spared the couple \nand told the truth, you'll find the cannibals dead with alghouls around them and Geralt will comment that Otto \nwasn't making idle threats. In this case, you can loot the corpses for the key to the hut and the strange meat.","-In 'Without a Trace', if you spared the couple and lied to Otto, you can see the husband grieving. Travel back to \nErde, meditate for a day or two while standing in front of the two peasants, fast travel back to the Herbalist's hut, \nthen right back to Erde without meditating. Then go inside their hut and you will see him standing over her bed \nwith some dialogue."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20403"},{"id":"k:roses on a red field","name":"Roses on a Red Field","namePl":"Róża na czerwonym polu","level":33,"tips":["-Guards in 'Rose on a Red Field' can be made to count to 100 using axii and you can stand there\nlistening to them do the counting."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=214241"},{"id":"k:tinker hunter soldier spy","name":"Tinker, Hunter, Soldier, Spy","namePl":"Druciarz, Myśliwy, Żołnierz, Szpieg","level":33,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=29317"},{"id":"k:from ofier s distant shores","name":"From Ofier's Distant Shores","namePl":"Z dalekiego Ofiru","level":33,"tips":["-You can purchase the Ofieri equipment set (scale armor, boots, gauntlets, sharovary, steel saber, silver sword, \nand crossbow) as well as the Ofieri horse gear (saddle, horse blinders, and saddlebags) from the Ofieri \nmerchant."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/From_Ofier%27s_Distant_Shores_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=267628"},{"id":"k:the royal air force","name":"The Royal Air Force","namePl":"Królewskie Siły Powietrzne","level":36,"tips":["-All the harpies in 'The Royal Air Force' wear helmets. The main scientist also caused the infestation of giant\nspiders in Hedel to the East.","-Locations of the New Moon Armor (end of 'The Heist' quest, cursed chapel, near Hedel, and during 'The \nRoyal Air Force')."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=secret-treasure-on-top-of-tower"},{"id":"k:the sword famine and perfidy","name":"The Sword, Famine and Perfidy","namePl":"Od miecza, głodu i zdrady","level":36,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=hidden-treasure-lv-25"},{"id":"k:the secret life of count romilly","name":"The Secret Life of Count Romilly","namePl":"Sekretne życie hrabiego Romilly","level":38,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Dark_Legacy_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=214269"},{"id":"k:the drakenborg redemption","name":"The Drakenborg Redemption","namePl":"Skazani na Drakenborg","level":38,"tips":["-Southeast of the Hunter's Cottage signpost, near the herbalist hut, you can talk to a man who's locked himself \ninside an outhouse. He'll have varying pieces of dialogue and if you zoom in, it looks like he's writing something."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Enchanting:_Quality_Has_Its_Price_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=l35-arachasaes"},{"id":"k:a surprise inheritance","name":"A Surprise Inheritance","namePl":"Z dobrodziejstwem inwentarza","level":38,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Surprise_Inheritance_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=guarded-treasure-griffin"},{"id":"k:races swift as the western winds","name":"Races: Swift as the Western Winds","namePl":"Wyścigi: Jak zachodni wiatr","level":32,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hearts_of_Stone","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=216189"}]},{"region":"Blood And Wine","steps":[{"id":"k:envoys wineboys","name":"Envoys, Wineboys","namePl":"Poselstwo z Krainy Wina","level":34,"tips":["-In the main menu of the game (where it shows 'continue', 'new game', 'load game', etc.) when Geralt is \nat a fire outside a barn, you can sometimes see Orianna pacing inside.","-The voice actress that does the voice of Anna Henrietta is the same actress that plays Tissaia de Vries in \nthe Netflix Witcher adaptation.","-There are 3 hanse bases in Toussaint and they are great ways to gain xp as well as acquiring a lot of swords\nto sell to the grandmaster armorer. As long as you don't kill the leader in each hanse base, you can leave the\narea, meditate/fast travel away, then come back and all the soldiers will be alive again. After level 50, the \nexperience gained is reduced drastically. I was able to get to level 55 just by doing the quests, so using this\nmethod is more for gaining money in the late game to pay for all the grandmaster witcher gear.","-Do not complete the following Hanse Base until AFTER you do the quest 'Bovine Blues' because there is a \ndetail that you can find a scrambled slyzard egg recipe only if you do not clear this hanse base: Filibert \n'Fourfingers' von Wittan's hanse base at Mont Crane Castle. The downside of this detail is that part of the quest \n(not the whole quest) will fail involving not burning the slyzard eggs, so it is more of an interesting option rather \nthan something you should do.","-You can purchase Toussaint horse equipment (saddlebags, blinders, and saddle) and a Toussaint crossbow at \nthe Grandmaster Armorer."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=214245"},{"id":"k:the beast of toussaint","name":"The Beast of Toussaint","namePl":"Bestia z Toussaint","level":35,"tips":["-Before fighting the giant named Golyat at the beginning of this quest, note that there is a missable trophy called\n'David and Golyat' where you have to one shot the giant by shooting a crossbow bolt in his eye.","-Find the boat which transported De La Croix's body after the brief interaction with the Bruxa in the inn \nnear the beginning @20:17. This only works after going to Corvo Bianco and then before doing the section \n\"Find Palmerin and ask him to take you to the duchess\".","-Bruxae seem to be the only vampires in the game that actually don't cast any shadows. The hooded woman \nthat turns into a bruxa unexpectedly, also does not cast a shadow. This woman is found at the guarded treasure \nlocation south east of Dun Tynne Crossroads signpost.","-Chat with the Bootblack before ever searching for Dettlaff and you'll get a set of unique dialogue.","-Visit Regis's home before meeting him. Geralt will make some comments. His home is in the\nMère-Lachaiselongue Cemetery. The link will direct you to where that is located.","-You can find bloodstains from the murder of De La Croix (D.L.C.) in the Mill. Map location @19:56.","-Find a note in the barn next to the Cockatrice Inn.","-During 'The Beast of Toussaint', in the palace gardens, there is an event where people are watching peacocks \nand you can pick up a grain cup that you can use to attract peacocks. It goes in your inventory wheel after the \nquest too. This can only be done with a mod.","-During 'The Beast of Toussaint' (part where you need to find Palmeran, after killing the bruxa, wait until \ndark before seeking the Duchess to get a unique scene @12:12.","-During 'The Beast of Toussaint', you can follow Anna Henrietta and listen to her speak to everyone to try \nand find the phoenix egg.","-Find the noblewoman's ring during the festivities (looking for the golden fish and unicorn during \n'The Beast of Toussaint') @4:03. Go to the base of the second waterfall further down. In the next gen \nupdate, if you're facing the waterfall, the ring will be at the base of the smaller stream to the left of the waterfall.","-During 'The Beast of Toussaint', while searching for the golden fish, you can find a \nman training a dog @3:36.","-During 'The Beast of Toussaint', while searching for the golden fish, you can find a \nZerrikanian leopard @3:17.","-If you don't get the fish in time during 'Beast of Toussaint', there is a funny cutscene.","-If you do get the fish in time during 'Beast of Toussaint', you are rewarded more experience points. It is \npossible to get it on your first try if you know where it is. It will also have a different cutscene, but I could\nnot find a video link.","-You can use axii to retrieve the clue from the 'unicorn' in 'Beast of Toussaint'. This will trigger a fight with 3 \nvillagers if you don't use axii on them.","-Up on some of the buildings in Beauclair, you can find a sign with a different language on it. It translates to \n\"The bean paste that looks like a bean paste, is not a good bean paste.\""],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=29767"},{"id":"k:blood run","name":"Blood Run","namePl":"Na tropie...","level":36,"tips":["-After you meet Dettlaff and Regis for the first time, go back to the greenhouse to loot Milton's hare \nmask @9:07.","-After the interaction with Dettlaff is over, you can loot the phoenix egg where Anna Henrietta opened it @8:25."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=426131"},{"id":"k:no place like home","name":"No Place Like Home","namePl":"Nie ma jak w domu","level":34,"tips":["-This quest can be done at anytime after 'The Beast of Beauclair', but I placed it here because it provides you\nwith a home base as well as your stash and many other worthwhile upgrades.","-If you did the trick of dropping your towel in Vizima and then picking it up, you can eventually put the towel on \nan armor rack in Corvo Bianco and it will make it look like your legs are protruding from underneath it.","-Deleted content available with the Brothers in Arms mod where Geralt raids the kitchen for some food during \n'No Place Like Home'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=426129"},{"id":"k:turn and face the strange","name":"Turn and Face the Strange","namePl":"Przemiana","level":35,"tips":["-This quest can be done at anytime after 'The Beast of Beauclair' and once you encounter the boy delivering a\nletter to you, but I placed it here because it unlocks mutation abilities - powerful upgrades to your skills that can \nalso add additional skill slots.","-During 'Turn and Face the Strange', there is a reference to the game Portal. During the part of the quest \nwhere you are going through portals, there is one specific portal that can lead you to a chest that has cake in \nit, which when consumed, permanently boosts your health by 100 points. This is a reference because in \nPortal, you can find a wall that has 'the cake is a lie' scribbled multiple times on it.","-In the Beauclaire's Infirmiry, you can find a man with his legs cut off.","-In Beauclaire's Infirmiry, you can find several drawings from the real Voynich Manuscript @15:49."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=215969"},{"id":"k:there can be only one","name":"There Can Be Only One","namePl":"Ścieżki przeznaczenia (Krew i Wino)","level":43,"tips":["-This quest can be done at any point, but I put it here because the reward gives you the best sword in the game.\nThere are multiple requirements to complete it and to meet those requirements, you can follow the examples in\nthe attached link.","-When you fail the trials of virtue while trying to obtain the sword Aerondight, during the 'There Can Be Only \nOne' quest, something unique happens. To do this, you have to be successful when going for the compassion \nand generosity virutes, but then do the following 6 things to trigger the 'failing to obtain the 6 virtues' part of the \nquest by failing the wisdom virtue:Do not correctly guess that Milton is in the greenhouse, do not successfully \nlift the curse from the wight (La Cage Au Fou), do not lift the curse from Daphne in 'A Knight's Tales', do not \nencourage Hugo to make peace with his Brothers (Father Knows Worst), do not correctly guess the order of \ncandles during 'But Other Than That, How Did You Enjoy the Play?', and lose the Gwent tournament. Obtain \nthe other virtues successfully and travel back to the old man that decides whether you received all 6 virtues \nand you will get a unique failed interaction with him."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=there-can-only-be-one"},{"id":"k:fists of fury toussaint","name":"Fists of Fury: Toussaint","namePl":"Turniej pięściarski","level":40,"tips":["-This quest can be done at any time. The only reason it is in the order section instead of the 'can be done at\nany time' section is because the following quest, 'Raging Wolf', can only be done after 'Fists of Fury: Toussaint'.\nThere is no time limit for these two quests and you do not have to technically complete them at this time.","-In 'Fists of Fury: Toussaint', Still Waters is a reference to Brienne of Tarth from Game of Thrones."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:raging wolf","name":"Raging Wolf","namePl":"Mistrz pięściarski","level":40,"tips":["-'Raging Wolf' can only be completed once 'Fists of Fury: Toussaint' is finished.","-After defeating every fist fight opponent, you will be awarded with the Fist Fighting Championship Trophy, which\nyou can mount in your bedroom in Corvo Bianco."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:wine wars belgaard part 1","name":"Wine Wars: Belgaard Part 1","namePl":"Awantura o wino: Belgaard","level":39,"tips":["-Complete the wine wars that expose Count Crespi before doing the tournament. The announcer will \nmention that the tourney is brought to us by the Vermentino and Coronata vineyards during the fight\nwith Gregoire.","-In the Belgaard Vineyard, you can find a small dog named Pottom and this might be one of the Chinese \nDeveloper's dog's name."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=426012"},{"id":"k:wine wars coronata","name":"Wine Wars: Coronata","namePl":"Awantura o wino: Coronata","level":37,"tips":["-In order to trigger 'Wine Wars: Consorting', there are specific things you must do. For 'Wine Wars: Coronata', \nyou must find \"Orders on Elegant Stationery\" at the objective marker (Guarded Treasure) northeast of the \nCoronata vineyard. Make sure to leave at least one objective UNCOMPLETED for 'Wine Wars: Coronata'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=954635"},{"id":"k:wine wars vermentino","name":"Wine Wars: Vermentino","namePl":"Awantura o wino: Vermentino","level":37,"tips":["-In order to trigger 'Wine Wars: Consorting', there are specific things you must do. For 'Wine Wars: Vermentino', \nyou must find \"Letter on Elegant Stationery\" at the objective marker (Guarded Treasure) north of Corvo Bianco. \nHere you also find the \"Heavy Brass Key\" that opens the warehouse during 'Wine Wars: The Deus in the \nMachina'. Make sure to leave at least one objective UNCOMPLETED for 'Wine Wars: Vermentino'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=954637"},{"id":"k:wine wars the deus in the machina","name":"Wine Wars: The Deus in the Machina","namePl":"Awantura o wino: Nieczysta gra","level":42,"tips":["-In order to trigger 'Wine Wars: Consorting', there are specific things you must do. Once you have the Elegant \nStationery items from 'Wine Wars: Coronata' and 'Wine Wars: Vermentino', complete the objectives for 'Wine \nWars: The Deus in the Machina'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=423697"},{"id":"k:wine wars consorting","name":"Wine Wars: Consorting","namePl":"Awantura o wino: Konsorcjum","level":40,"tips":["-'Wine Wars: Consorting' is only triggered if you follow the above steps (completing 'Wine Wars: The Deus in \nthe Machina' BEFORE fully completing either 'Wine Wars: Coronata' or 'Wine Wars: Vermentino'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:wine wars belgaard part 2","name":"Wine Wars: Belgaard Part 2","namePl":"Awantura o wino: Belgaard","level":39,"tips":["-After completing the Wine Wars quests, you can expect a delivery of wine if you successfully helped the \nvineyard owners solve their problem. Speak with the Majordomo in Corvo Bianco and he will direct you to the \ncellar to find the wine. This can be done at the end of the game as well."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=426012"},{"id":"k:the warble of a smitten knight","name":"The Warble of a Smitten Knight","namePl":"Pieśń rycerskiego serca","level":35,"tips":["-Complete before Capture the Castle, otherwise it will fail. It is also a prerequisite for other secondary quests.","-If you choose Ravix of Fourhorn as your name, you will get into a fistfight with 3 men rather than a mounted \nduel if you choose Geralt of Rivia as your name in 'Warble of a Smitten Knight' while signing up for the \ntournament.","-You can find a letter from Queen Meve to her son Ansais @16:08.","-During Warble of a Smitten Knight, go into Guillaume's tent to find a poem about Vivienne. While you \nand Guillaume are both in Vivienne's tent, you can hear him saying this poem.","-After winning the tournament, you can go back to your tent to find three love letters from admirers. An \nactual admirer will follow you around the arena grounds if you win.","-There is a theory that the crone Whispess may be behind Vivienne's curse.","-If Guillaume and Vivienne end up together (transfer curse to him), you can find them at the end \nof the DLC @3:36.","-Vivienne in Novigrad if you transferred her curse to the oriole. It can be triggered a week after the B&W \nexpansion main quest is done.","-If Vivienne chooses to have the lifespan of an orielle in 'Warble of a Smitten Knight', you can find her in Skellige. \nIf you pass 7 years of in game time, she can be found dead in her house. @0:28.","-Finding drunk Guillaume at the very end if Vivienne chose the lifespan of an Oriole.","-Theory about the crone, Whispess, and her involvement with Vivienne from 'Warble of a Smitten Knight' as \nwell as contradictions to the theory.","-If using console commands, there seems to be an end of time that breaks the game @4:16."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:the last exploits of selina s gang","name":"The Last Exploits of Selina's Gang","namePl":"Ostatni skok gangu Seliny","level":37,"tips":["-Get the note from the lake shore to start this quest BEFORE doing 'Till Death Do You Part'. There is a chest\nin the cemetary of 'Till Death Do You Part' that if you loot it before starting 'The Last Exploits of Selina's Gang',\nthen it will be glitched and you won't be able to complete the treasure hunt. This might be fixed in the next gen\nupgrade, but it was a problem I had in a previous playthrough.","-You can find a grave in Toussaint that might be referring to Ciri. The name on the stone is L'Hirondelle, which \ntranslates to The Swallow. It will actually be there no matter what ending you get in the game and might be \nreferring to 'False Ciri', who is mentioned in the books, but not in the games."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=29736"},{"id":"k:till death do you part","name":"Till Death Do You Part","namePl":"Wieczne Odpoczywanie","level":36,"tips":["-Get the note from the lake shore to start 'The Last Exploits of Selina's Gang' BEFORE doing 'Till Death Do \nYou Part'. There is a chest in the cemetary of 'Till Death Do You Part' that if you loot it before starting 'The Last \nExploits of Selina's Gang' then it will be glitched and you won't be able to complete the treasure hunt. This might\nbe fixed in the next gen upgrade, but it was a problem I had in a previous playthrough.","-Attached is a list of all tombstone inscriptions in the Mere-Lachaiselongue Cemetery.","-Attached is a list of all tombstone inscriptions in the Orlemurs Cemetery.","-During 'Till Death Do You Part', when searching the cemetery, you can find tracks that lead to bloomers on a \ntree branch, a site where grave robbers have dug up a grave, and empty wine bottles.","-In the cemetery east of the Nilfgaardian Embassy in Toussaint, you can find a small sign on one of the \ncrooked little crypts. Geralt will even read it out loud. This holds the Nuragus family and the inscription \ntranslation refers to some naughty behaviour.","-Find Milton's grave @4:12.","-In 'Till Death Do You Part', if you choose to support Margot, she will tell you where two Gwent cards are \n(Barclay Els and Vampire: Bruxa), but you may have these already from the main game and they will not give \nyou duplicates of these if you do have them. Siding with Louis, you can obtain the Forged in Fire sword.","-During Till Death Do You Part, if you move Margot's urn away, while finding her mother's grave, you can \nget a unique interaction in the cemetary @20:24."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=216002"},{"id":"k:bovine blues","name":"Bovine Blues","namePl":"Zlecenie: Łaciate kłopoty","level":38,"tips":["-In the quarry, you can find a broken stone hand that is giving the middle finger.","-If Filibert 'Fourfingers' von Wittan's hanse base at Mont Crane Castle hasn't been cleared yet, and 'Contract: \nBovine Blues' is completed without destroying the slyzard eggs at Fort Ussar Ruins, upon returning to Fort \nUssar Ruins, a bandit camp will have appeared with 2 bandits there named Mathieu Le Mièche and Mikael Le \nMièche. Once you dispose of them, you can loot their chest to find the recipe for Scrambled Slyzard Eggs. This\nis more of an interesting detail than something you should do since it will fail an objective (not the whole quest)\ninvolving not burning the slyzard eggs."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=426014"},{"id":"k:extreme cosplay","name":"Extreme Cosplay","namePl":"Rekonstrukcja","level":40,"tips":["-This quest is proximity sensitive and will disappear if you find it and then leave without starting the quest. It can\nbe done at any time, but because it is proximity sensitive, I placed it before 'La Cage au Fou' since they are\nsomewhat close to each other. Warning that it can be difficult.","-'Extreme Cosplay' can have some very difficult enemies, so it is highly recommended to save before attempting\nthis quest, or to even wait to be a higher level.","-The elven shield you obtain in 'Extreme Cosplay' can be mounted on a wall in Corvo Bianco."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=extreme-cosplay"},{"id":"k:la cage au fou","name":"La Cage au Fou","namePl":"Pogłos","level":39,"tips":["-Find a book written by Dandelion in Regis's hideout.","-Illusionary wall in Regis's hideout @9:29.","-Find Regis's note beside his bed.","-During 'La Cage Au Fou', after speaking with Regis and before searching for the Wight for the first time, go \nback into Regis's lair and you can find him as a wisp of smoke and he will also have some unique dialogue \nif you try speaking to him while he's in human form.","-Note that once you reverse the curse by dining with the wight, it gives you an option to chase after her or to go\nfind Regis. Make sure to follow the Wight/Marlene before talking to Regis in order to get an extra quest (The\nHunger Game) from Marlene.","-During 'La Cage au Fou', if you don't chase after Marlene when she runs away and instead go back to \nRegis, you can find her dead body nearby. Her character model will never be removed, but you can see her \nbones underneath. Marlene's model is no longer standing on her bones in the Next Gen Edition.","-Black version of the Hen'gaidth armor @7:16 which is called the Tesham Mutna Armour Set includes Tusham \nMutna armour, trousers, steel sword, boots, gauntlets, and mask found in the Tesham Mutna section of 'La \nCage Au Fou'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:spoontaneous profits","name":"Spoontaneous Profits!","namePl":"Tajemnica zaginionej łyżki","level":42,"tips":["-'Spoontaneous Profits!' can only be done after 'La Cage au Fou' and can be obtained during this quest. Once \nyou enter the house with the many spoons, when you find the Spoon Key, it will begin 'Spoontaneous Profits!'","-In 'Spoontaneous Profits', Ra'mses Gor-Thon is referring to Gordon Ramsey, the master chef.","-While entering a cellar during 'Spoontaneous Profits!', you will find a cookbook written by Smigole Louis Serkis, \nwhich references the amazing Andy Serkis who portrayed Gollum/Smeagol in the Lord of the Rings movies."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=treasure-hunt"},{"id":"k:amidst the mill s grist","name":"Amidst the Mill's Grist","namePl":"W starym młynie","level":42,"tips":["-Must be completed after 'La Cage au Fou' and BEFORE 'Where Children Toil, Toys Waste Away'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Amidst_the_Mill%27s_Grist_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=426013"},{"id":"k:the hunger game","name":"The Hunger Game","namePl":"Marlena (zadanie)","level":42,"tips":["-Must be completed before 'Where Children Toil, Toys Waste Away'.","-Ensure you allow Marlene to stay at Corvo Bianco. She will then send you to get her dowry, which gives you\nthe Gold Stick of Joy trophy, which you can mount in your room in Corvo Bianco."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:where children toil toys waste away","name":"Where Children Toil, Toys Waste Away","namePl":"Leże Bestii","level":42,"tips":["-Visit Orianna's orphanage before the end of the game, possibly at the beginning of 'Where Children Toil, \nToys Waste Away', to see a bunch of kids and teacher in the yard. You can find Arnaud at a shrine \nhere as well.","-When you first go to the bootblack, don't wear any shoes to have a unique scene with him. Do the same \nthing the second time you meet with him while with Regis. If you also don't have boots in your inventory, he will \npolish your barefeet.","-During 'Where Children Toil, Toys Waste Away', in Dettlaff's toy shop, you can find Nilfgaardian toy \nsoldiers, and one that looks different from the rest @11:49.","-During 'Where Children Toil, Toys Waste Away', if you try to leave before finishing the investigation, \nRegis will make a comment when you are just outside the shop.","-During 'Where Children Toil, Toys Waste Away', loot the items in a different order to get a unique piece \nof dialogue @13:50.","-For 'Where Children Toil, Toys Waste Away', right after completing the quest, if Geralt re-enters The Rocking \nHorse shop to meet Regis, then Regis will be irritated for a moment as he already told Geralt he can't be there \nor else Detlaff will never appear. This will have no affect on the quest.","-For 'Where Children Toil, Toys Waste Away', after the quest completes, Geralt can go back to the bootblack and \nspeak to him for some minor extra conversation. This can be done even at nighttime immediately as the quest \ncompletes, despite the bootblack having working hours."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:wine is sacred","name":"Wine is Sacred","namePl":"Wino rzecz święta","level":42,"tips":["-Benoît is the Duke of Sumelier's wine expert who Geralt meets during the main quest \"Wine is Sacred\". He \nhas something written on his shirt and it translates to \"Truth in Wine\".","-During 'Wine is Sacred', while visiting the wine cellar, if you find the 1269 vintage wine before speaking with \nAnna Henrietta, she will have slightly different dialogue.","-After completing 'Wine is Sacred', you can have an ambush encounter near the Harbor Gate. You can find a \nnote on their bodies that shows a contract to kill Geralt."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:a portrait of the witcher as an old man","name":"A Portrait of the Witcher as an Old Man","namePl":"Portrecista","level":43,"tips":["-'A Portrait of the Witcher as an Old Man' is only available AFTER 'Warble of a Smitten Knight' is complete. It \ncan be done at any time once it's available.","-In 'A Portrait of a Witcher as an Old Man', if you run away from the griffin, the quest will fail and the painter will \ndie. You can loot some items from his body.","-Wait a whole day and go to the market to buy the portrait.","-Here is a link to all 8 variations of the portrait you can get from 'A Portrait of a Witcher as an Old Man'.","-After completing A Portrait of the Witcher as an Old Man, you can find the painting somewhere in the \nBelles of Beauclaire brothel a few days after finishing the quest. Unfortunately, it did not appear for me\non my playthrough, so I'm not sure how to properly trigger it."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Portrait_of_the_Witcher_as_an_Old_Man_Walkthrough","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=216025"},{"id":"k:of sheers and a witcher i sing","name":"Of Sheers and a Witcher I Sing","namePl":"W służbie muzy","level":43,"tips":["-'Of Sheers and a Witcher I Sing' is only available AFTER 'Warble of a Smitten Knight' is complete. It can be \ndone at any time once it's available.","-After doing Of Sheers and a Witcher, the barber that you liberate is the only one able to give you a \nbowl cut as a hair cut."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=249441"},{"id":"k:the man from cintra","name":"The Man from Cintra","namePl":"Szlachcic z Cintry","level":43,"tips":["-Right before 'The Man from Cintra', wear Olgierd's outfit to get a unique line from Anna Henrietta. There are \nmany clothing options with different responses from Anna. If you wear the appropriate attire (Nilfgaardian or\nBeauclair style, but not Skellige), she will compliment you on your style. If you don't have appropriate attire,\nAnna will criticize you, but will have prepared and give you a Beauclair set. If you didn't have appropriate\nattire, but had it in your inventory, Anna will criticize you and then you change into the set in your inventory. \nAnna doesn't acknowledge if you were just wearing your breeches and treats it like you were wearing armor.\nIn the past, if you have your weapons or a mask already on, she would compliment you on your forethought, \nbut still give you a different mask. The Next Gen Update automatically removes any swords or masks you may \nhave had on before the cutscene even starts, so she doesn't acknowledge it anymore.","-There might be a bug when trying to interact with the mimes during 'The Man From Cintra'. They usually are \npretending to pull an invisible rope and then you pull it from them.","-Right after the masquerade, you can find the body of the Cintrian behind the house @18:27."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:capture the castle","name":"Capture the Castle","namePl":"Szturm na Dun Tynne","level":47,"tips":["-'Capture the Castle' is a cutoff point. If you start it, 'Warble of a Smitten Knight' will fail if you haven't completed\nit yet. Also, once you start 'Capture the Castle', you won't be able to do any side quests until after you complete\nthe rest of the main story questline. Make a hard save before starting this quest.","-There's a new dialogue option with Anna Henrietta after the Blood and Wine expansion (if she survives) or if \nyou talk to her before meeting Damien during 'Capture the Castle'. You can now ask her if Toussaint has \nalways been neutral. She can be found in the palace area that is just South-East of the Beauclair\nPalace signpost.","-Here is a link to the text guide of how to get each of the Blood and Wine endings if you need it.","-Here is a video link on how to get each of the Blood and Wine endings if needed."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:the night of long fangs","name":"The Night of Long Fangs","namePl":"Długa noc","level":47,"tips":["-Hen Gaidth gauntlets, Hen Gaidth steel sword, and Gesheft swords @7:28 (Do part of Orianna's quest until you \nget the key, then go to the 'Land of a Thousand Fables'). This method is if you do not want the bad ending, but\nstill want some of the Hen Gaidth equipment from the Unseen Elder's lair.","-During the 'Night of Long Fangs', you can help a knight @4:49 (the knight sometimes spawns \nafter killing the katakan).","-During 'Night of Long Fangs', if you go towards Orianna, you will see a Garkain attacking a wagon. \nOnce you kill it, you can find and speak to a boy hiding underneath @9:04.","-During 'The Night of Long Fangs', you can find Guillome's body if you didn't complete 'Warble of a Smitten \nKnight'.","-During the 'Night of Long Fangs', when looking for Orianna, turn left to find a group worshipping \nvampires @1:32 (this is near where you were throwing paintballs).","-After the 'Night of Long Fangs', you can find a pile of burning bodies in the arena. You can see the \nsmoke from a distance. You can find this at the very end of the game as well.","-After the 'Night of Long Fangs', all innkeepers sell mirrors, garlic, and wooden stakes.","-A Night to Remember modded side quest that can only be added on PC."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Blood And Wine","steps":[{"id":"k:duck duck goosed","name":"Duck, Duck, Goosed!","namePl":"Gę, gę, gę!","level":47,"tips":["-You must complete this quest before finishing 'Beyond Hill and Dale', but it does take place during 'Beyond Hill \nand Dale'.  After completing, the goose will award Geralt with a golden egg. Put the egg in your consumables \nslot and eat the egg; it will give you one free skill point when you do so. Important: You must consume it before \nyou leave the fabled world or else it disappears from your inventory (as it is part of the illusion).","-For 'Duck, Duck, Goosed!', note that you should get the contract at the signboard near the girl who sells flint \nfirst before completing the quest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/fablesphere?marker=216179"},{"id":"k:beyond hill and dale","name":"Beyond Hill and Dale...","namePl":"Dawno, dawno temu...","level":47,"tips":["-During the 'Beyond Hill and Dale' quest, you can find a chili pepper under a bridge. This references the Red Hot\nChili Peppers band and one of their songs called 'Under the Bridge'.","-During 'Beyond Hill and Dale', in Long Locks' tower, the fruit keeps respawning after looting.","-Find puss and boots in the land of a thousand fables @2:21.","-Toussaint armor set @6:04 Follow the will o' the wisp.","-During 'Beyond Hill and Dale', you can find the end of the rainbow, dead dragon, a knight that has lootable \narmor (Will o' the Wisp leads you to him), Thumbelina (you can step on her)  @13:23.","-More things during 'Beyond Hill and Dale': crushed legs with ruby slippers @15:13.","-Musicians of Blavikan in The Land of a Thousand Fables, just north of Little Red Riding Hood's House. They \nwill disappear when you approach them, and Syanna will make a comment.","-In the Land of a Thousand Fables, you can find the emperor of Nilfgaard wandering around near the 3 little pigs \narea and he just has underwear on.","-In the Land of a Thousand Fables, you can dive off of longlocks' tower and loot some skeletons underwater.","-You can kill the sky giant in The Land of a Thousand Fables with a crossbow bolt to the eye just like at the \nbeginning of the DLC with Golyat.","-After defeating the cloud giant in The Land of a Thousand Fables, follow the will o the wisp to obtain a sword, \nGesheft, and a Dark Souls bonfire reference.","-During 'Beyond Hill and Dale', you can see a whale falling from the sky @16:06 before jumping down \nthe final well.","-The Golden Donkey during 'Beyond Hill and Dale' @15:43 It poops gold Find before jumping \ndown the well at the end."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Beyond_Hill_and_Dale","mapUrl":null},{"id":"k:tesham mutna","name":"Tesham Mutna","namePl":"Tesham Mutna (zadanie)","level":49,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":null},{"id":"k:option a pomp and strange circumstance","name":"OPTION A) Pomp and Strange Circumstance","namePl":null,"level":49,"tips":["-During this second time you meet the bootblack with Regis, don't wear any shoes to have a unique scene with \nhim. If you also don't have boots in your inventory, he will polish your barefeet.","-The correct dialogue choices with Syanna during 'Pomp and Strange Circumstance' in order to get the good \nending is the following: \"Cause she turned her back on you, forgot about you.\" and then \"Ever thought to \nforgive her?\"","-At the end of Blood and Wine, at the ceremony with Ana Henrietta and Syanna, there will be characters that \nwill attend the ceremony if you solved their issues. You can see Guillaume and Vivienne (Warble of a Smitten \nKnight - transfer the curse to Guillaume), Francois and Jaquette (Feet as Cold as Ice - If you convinced Francois \nto return to Jaquette), Martin Monnier (Gwent: To Everything - Turn, Turn, Tournament! - He's the one promoting \nthe Skellige faction. He will appear if you took part in the Gwent tournament), Brigitte/Still Waters (Female \nfistfighter in the Fists of Fury: Toussaint quest), and even the noblewoman that lost her ring at the palace \ngardens.","-The last scene that determines Anarrieta's fate, she will be wearing all blue jewels if Syanna will kill her \nand she will wear one red jewel if Syanna is about to forgive her.","-During the 'bad ending' of Blood and Wine, before attending the funeral, there is a woman that is selling \nflowers and says that Anna Henrietta's favourite flower was the white rose. You can find a single white rose \nwhere the murder occurred, just south of the Palace Gardens.","-During 'Pomp and Strange Circumstance', if you don't put on the mask and gloves, Geralt will make agonizing \nsounds while picking the mandrake root."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:option b burlap is the new stripe","name":"OPTION B) Burlap is the New Stripe","namePl":null,"level":49,"tips":["-Make sure to do 'The Perks of Being a Jailbird' and 'Using Your Loaf' before heading down to do the laundry,\notherwise they will both fail.","-If you end up in prison, you will encounter the 3 men that attacked you near the bootblack.","-In 'Burlap is the New Stripe', you can still escape the prison in a unique way by drinking the Superior White \nRafford's Decoction as you're falling from the castle wall. You won't be able to do certain things like fast travel \nthough, so reload a save after trying this out."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the perks of being a jailbird","name":"The Perks of Being a Jailbird","namePl":"Skarby spod celi","level":49,"tips":["-This is only available during 'Burl
