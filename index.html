eference \nto Cahir (if Aryan is alive for this playthrough).","-During 'Broken Flowers', if you make your own way to the Vegelbuds' residence for the horse race, you can \noverhear La Valette and Voorhis talking (if Aryan is alive).","-When trying to find Molly during 'Broken Flowers', the Baroness La Valette will have a different reaction to \nyou depending on if you killed her son Aryan in the Witcher 2 game (a choice you also decided on earlier in \nthe Witcher 3 when discussing details about the second game). She will either be extremely pleasant or she \nwill be rude to you and will not join you for the races. Morvran Voorhis will also have more to say about Aryan's \ndemise and what happened since then if you killed Aryan. Molly becomes a noble lady if Aryan is dead instead \nof being a servant otherwise.","-During \"Broken Flowers\", as you approach the Nilfgaardian Embassy, before speaking with Rosa var Attre, you \ncan see a message written on one of the walls.","-In 'Broken Flowers', you can tell the guard that you are the new cook. You can go up to the door and get \nadditional dialogue about asking for Rosa. If you say you are the swordplay instructor, he'll just let you in, but the \nother two pieces of dialogue are better since you'll have to go around the back to get inside. Saying you are the \ncook makes the soldier not want to let you in, but after you find an alternate way in, he will make a comment \nsaying how Geralt said he was the new cook and that Geralt is lying. Rosa defends you and plays along.","-During \"Broken Flowers\", before speaking with Rosa var Attre, find a dead body behind the house.","-During \"Broken Flowers\", when meeting with Marabella, say that you can't wait, and you'll get a funny \nexchange with the kids.","-If you released the mother of the crones during 'The Whispering Hillock', you can find a list of the \nchildren's names from Crookback Bog in Marabella's hut during 'Broken Flowers'.","-After the Vegelbud race during 'Broken Flowers', once you speak to Molly, you will have the option of returning\nto Novigrad on your own, or joining La Valette and Morvran Voorhis. Choose to join them because when you \nreturn, Morvran will sit on a bench and you can speak to him to get some unique dialogue.","-The ending with each of the women in 'Broken Flowers' will change slightly depending on the order that you \nsee each of them.","-Make sure to challenge Zoltan to gwent right at the end of 'Broken Flowers'. You can play him again later, but \nit's during a quest later on, so might as well get his card now and start 'Gwent: Old Pals'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Broken_Flowers","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555833"},{"id":"k:fencing lessons","name":"Fencing Lessons","namePl":"Lekcja szermierki","level":12,"tips":["-Accept the fencing offer and complete before 'Isle of the Mists'.","-During 'Fencing Lessons', if you let her win the sword match, she will have some unique dialogue and will \ncall herself the Black Bruxa.","-The seven cats inn actually has seven cats."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Fencing_Lessons","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425983"},{"id":"k:the dwarven document dilemma","name":"The Dwarven Document Dilemma","namePl":"Przesyłka kurierska","level":2,"tips":["-'The Dwarven Document Dilemma' may not be able to be triggered if you have started 'Fencing Lessons' but\nhave not yet completed it."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=the-dwarven-document-dilema"},{"id":"k:old pals","name":"Gwent: Old Pals","namePl":"Gwint: Starzy znajomi","level":5,"tips":["-Start 'Gwent: Old Pals' so that you can face off against Lambert in 'Following the Thread'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:following the thread","name":"Following the Thread","namePl":"Po nitce do kłąbka","level":11,"tips":["-Complete before 'Ugly Baby', but after 'Flesh for Sale'.","-During 'Following the Thread', Lambert asks you to find Hammond. If you talk to Crach an Craite in Skellige \nbefore actually finding Hammond, but after talking with Lambert, you can get some dialogue from him saying \nthat he will give you a reward for his head. Previously, you could never obtain this reward, but in the next gen \nupgrade, you can visit Crach, before returning to Lambert in Novigrad and after killing Hammond, and Crach \nwill give you a reward. If Crach does not have any dialogue options at this time, once you finish 'The Lord of\nUndvik' and 'Possession', you should be able to speak to him and he will give you a reward.","-Play Lambert in Gwent as soon as possible, as his card, while attainable later, can be missed. I believe at the\nvery end of 'Following the Thread', you can speak to him before he leaves the area and challenge him to a \ngame.","-During 'Following the Thread', you meet a man named Karadin who has a wife and children. There is a tidbit \nof information based on the game code that leads to the theory that the wife in the quest is not actually \nKaradin's wife and is there more for a setup to kill Geralt and Lambert.","-Lambert's armor is very similar to the armor that Geralt wears in The Witcher 2.","-Lambert can be found at the Nowhere Inn after you complete 'Following the Thread' and are looking for him \nduring 'Gwent: Old Pals'. Once you start 'Ugly Baby' however, he will be in Kaer Morhen instead.","-Deleted content available with the Brothers in Arms mod. More cutscenes with Lambert during the quest \n'Following the Thread'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:get junior","name":"Get Junior","namePl":"Dorwać Juniora","level":12,"tips":["-Here is a video detailing the Gangs of Novigrad and Get Junior quests and how to achieve all green \ncheckmarks for the objectives. Do this after the bathhouse scene with Reuven/Dikstra. It's suggested to not \nbring up Dandelion during the bathhouse scene so you can focus on these quests first. During the video, there's \na part when you speak with Ivor. Consider doing a save here and trying out the fight in the pit just to see the \nscenes that plays out, but then reload your save before, since you don't want to actually go in the pits, and \ncontinue with what the video describes.","-'Get Junior' and 'The Gangs of Novigrad' can be challenging to have all green checkmarks in the mission guide\neven though you still successfully complete them without failing. This reddit post has a solution to obtain all \ngreen checkmarks for both quests.","-In order to not fail any of the parts of 'Get Junior' and 'The Gangs of Novigrad', follow this reddit post guide.","-Deleted dialogue with the Brothers in Arms mod where one of the guards will try to stop you when trying to \nenter Radovid's chess club during 'Get Junior'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Get_Junior","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555834"},{"id":"k:the gangs of novigrad","name":"The Gangs of Novigrad","namePl":"Gangi Novigradu","level":9,"tips":["-This quest will fail once you meet Roche's contact during a later part of 'Get Junior'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425996"},{"id":"k:ciri s story visiting junior","name":"Ciri's Story: Visiting Junior","namePl":"Historia Ciri: Z wizytą u Juniora","level":9,"tips":["-How to get Ciri's sword in the next gen edition during 'Ciri's Story: Visiting Junior'. Once you get to your stash, \nmake sure to 'drop' your sword. Afterwards, you can go to the brothel to get a funny interaction. Follow the video \nto know how to finish the quest once you drop the sword in your stash. When you are Geralt, you can loot the \nsword that is dropped near the stash. This may have been fixed, so you might not be able to drop the sword \nanymore, but you can still do the brothel interaction. This is probably for the best since you wouldn't be able to \nfight future bosses as Ciri without a sword. \n**With the most recent update (4.01), you unfortunately can't do any of these unique situations, but you can still \nview the video to see how it used to happen.**"],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Ciri%27s_Story:_Visiting_Junior","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555837"},{"id":"k:a favor for radovid","name":"A Favor for Radovid","namePl":"Przysługa dla Radowida","level":9,"tips":["-In Oxenfurt, talk to Carduin next to Radovid's ship if Triss was saved in the Witcher 2."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Favor_For_Radovid","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20475"},{"id":"k:honor among thieves","name":"Honor Among Thieves","namePl":"Honor złodzieja","level":9,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Honor_Among_Thieves","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20413"},{"id":"k:the apiarian phantom","name":"The Apiarian Phantom","namePl":"Zlecenie: Barciowe Widziadło","level":14,"tips":["-If you saved Rico during 'Get Junior', then Geralt will mention him to the family during 'Apiarian Phantom'.","-In Honeyfill Meadworks, you can find many halfling sized items in and around the house.","-One of the halflings in the northern end of Honeyfill Meadows will say \"Don't dare call me Bagginson\" which \nreferences Bilbo and Frodo Baggins from the Lord of the Rings."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_The_Apiarian_Phantom","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=contract-the-apiarian-phantom"},{"id":"k:a warm welcome","name":"A Warm Welcome","namePl":"Serdeczne przywitanie","level":null,"tips":["-Do a 'Warm Welcome' before looking for Witcher George's Griffin diagrams (the peasant you save \nwill tell you where it is)."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:strangers in the night","name":"Strangers in the Night","namePl":"Obcy w nocy","level":null,"tips":["-In 'Strangers in the Night', the merchant may in fact be a Nilfgaardian spy because the soldier \nfinds Nilfgaard currency on the merchant's body afterwards."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:a barnful of trouble","name":"A Barnful of Trouble","namePl":"Nieproszeni goście","level":11,"tips":["-Complete immediately when started."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:an eye for an eye","name":"An Eye for an Eye","namePl":"Oko za oko","level":12,"tips":["-Complete before the 'Isle of the Mists'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/An_Eye_for_an_Eye","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20116"},{"id":"k:count reuven s treasure","name":"Count Reuven's Treasure","namePl":"Skarb Hrabiego Reuvena","level":12,"tips":["-In 'Count Reuven's Treasure', if you ask about the treasure first, without angering the guards or giving up the \ncharade with Triss, you will find the key to Reuven's treasure which makes Dijkstra happy. You won't get info \non Dandelion, but you'll be able to get that later anyways.","-During 'Count Reuven's Treasure', you can help Triss burn the place down with igni."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Count_Reuven%27s_Treasure","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555839"},{"id":"k:the play s the thing","name":"The Play's the Thing","namePl":"Niech żyje sztuka!","level":11,"tips":["-During 'The Play's the Thing', when you are recruiting jugglers from the performing troupe called the Puffins, \nthey ask you to get rid of some thugs outside. What you can actually do is get rid of the thugs before even \ntalking with the Puffins and you will get a different scene. This optional objective is also the only time Geralt will \nsay 'Shit happens'. You will also get some funny dialogue if you try and bribe the thugs and then refuse to fight,\r\nbut this only occurs if you see the puffins first and then see the gang."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/The_Play%27s_The_Thing","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555838"},{"id":"k:playing innkeeps","name":"Gwent: Playing Innkeeps","namePl":"Gwint: Partyjki z karczmarzami","level":1,"tips":["-Play Olivier before 'Now or Never'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:a poet under pressure","name":"A Poet Under Pressure","namePl":"Poeta w opałach","level":13,"tips":["-In 'A Poet Under Pressure', when you talk with Dijkstra, he will give you either 3, 4, or 6 men depending on the \ndifferent dialogue choices and only if you helped him get his treasure.","-Loot more items while following the trail (Dandelion's perfume, wrong path, \nDandelion's ring, his writings).","-In 'A Poet Under Pressure', both the painting and ring can be given to Dandelion or kept for yourself. \nAdditionally, they can be stored in your stash, and still be given to Dandelion, creating duplicates of them.","-After receiving the portrait of Hierarch Hemmelfart, you can give it to Dandelion and he will \neventually have it up on a wall (above the door that is straight ahead as you walk in to the Rosemary \nand Thyme @11:20."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:ciri s story breakneck speed","name":"Ciri's Story: Breakneck Speed","namePl":"Historia Ciri: Na złamanie karku","level":11,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Ciri%27s_Story:_Breakneck_Speed","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=555841"},{"id":"k:in ciri s footsteps novigrad","name":"In Ciri's Footsteps: Novigrad","namePl":"Śladami Ciri: Novigrad","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:a dangerous game","name":"A Dangerous Game","namePl":"Niebezpieczna gra","level":12,"tips":["-Complete before the 'Isle of the Mists'.","-Take the Gwent cards during 'A Dangerous Game' because after this, they can only be found from the Prison \nWarden in the quest 'The Great Escape'.","-When chasing Duke, you can do the quest 'A Tome Entombed' while in the sewers. It's easy to miss, but not\nmissable since you can go back in the sewers at another time.","-In 'A Dangerous Game', when Geralt says \"Zed's dead\", it is a reference to the movie Pulp Fiction.","-Collect the Green Statuette at Caesar's."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Dangerous_Game","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=154532"},{"id":"k:a tome entombed","name":"A Tome Entombed","namePl":"Poszukiwacz zaginionej krypty","level":13,"tips":["-You can find this during 'A Dangerous Game' when you are chasing after Duke. As long as you have access to\nthe sewers, you can access this quest later on as well."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:cabaret","name":"Cabaret","namePl":"Kabaret","level":14,"tips":["-Complete before the 'Isle of the Mists'.","-During Cabaret, after recruiting Polly and before finishing the quest with the placards, speak with \nDandelion and you will have some unique dialogue.","-You can find Polly teaching the girls how to dance after hiring her in the 'Cabaret' quest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Cabaret","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=154533"},{"id":"k:face me if you dare iii","name":"Face Me if You Dare (III)","namePl":"Zmierz się ze mną!","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the nobleman statuette","name":"The Nobleman Statuette","namePl":"Statuetka szlachcica","level":14,"tips":["-Before 'Now or Never', buy from a merchant at Gilford. Can be done before 'Final Preparations' as well."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425986"},{"id":"k:the soldier statuette","name":"The Soldier Statuette","namePl":"Statuetka żołnierza","level":14,"tips":["-Complete before 'Now or Never'. Found during the 'Dangerous Game' quest. Can be done before 'Final Preparations' as well."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=215937"}]},{"region":"Velen","steps":[{"id":"k:races the great erasmus vegelbud memorial derby","name":"Races: The Great Erasmus Vegelbud Memorial Derby","namePl":"Wyścig: Gonitwa Erazma Vegelbuda","level":1,"tips":["-This race can only be found after or doing most of 'Get Junior'. The start of the quest is found in Novigrad, but\nthe race itself takes place in Velen near the Vegelbud residence. BEFORE starting the race, meet with Triss just\nto get some unique dialogue about Ingrid Vegelbud (don't start 'A Matter of Life and Death' yet) and THEN you\ncan go do the 'Races: The Great Erasmus Vegelbud Memorial Derby'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Novigrad/Oxenfurt","steps":[{"id":"k:a matter of life and death","name":"A Matter of Life and Death","namePl":"Kwestia życia i śmierci","level":12,"tips":["-If you complete 'Redania's Most Wanted' first, you can get dialogue about the crystal from Triss, BUT if you \nwant to have all green objectives complete, then you should NOT speak to Triss about the crystal, and should \nonly speak to Yen about it. For some reason, even if you don't speak to Triss about it, it will still be marked as \nsuccessful in the quest objectives.","-In 'A Matter of Life and Death', when you meet Triss at her home, you will notice that the building is slanted. \nThe house next to it is also crooked. There is an actual reason for this and you can hear it from the repair \nworkers working on fixing the houses. Whoever was living next to Triss's house, tried to dig a tunnel all the \nway to Vivaldi's bank. The tunnel caved in and the houses sunk as a result.","-You can get new dialogue with Triss about Ingrid Vegelbud if you have not yet met Lady Vegelbud.","-As you are looking for the guy in the blue tunic during 'A Matter of Life and Death', you can find Triss in an \nalleyway. Once you find the guy, don't accept quite yet. You can return to Triss in the Alley to get a bit of \nextra dialogue.","-There are 2 other guys with blue tunics that you can talk to during 'A Matter of Life and Death'.","-Some dialogue with Triss that you may have missed while conversing with her during the Masquarade quest.","-During the Masquarade quest, there is a reference to the movie 'Pretty Woman' at the beginning of the quest \nwhen a man refers to Triss as Vivian and mentions another man named Edward.","-Find 3 unique people at the Masquerade @7:20 (Dijkstra, La Valette, and some dancing women with some \nmen behind some bushes, etc.). Make sure to get the Dandelion Gwent card during this quest, otherwise you \nwill not get a chance to get it later on.","-In 'Matter of Life and Death', you can run into a random drunk, Moritz, and Morvran Voorhis as well.","-Between the masquerade quest and major evacuation quest Now or Never, find Moritz \npast Glory Gate to save him @3:23 (can see him with other mages during 'Now or Never' if you save him)."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Matter_of_Life_and_Death","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425987"},{"id":"k:witch hunter raids ii","name":"Witch Hunter Raids (II)","namePl":"Nalot łowców czarownic","level":null,"tips":["-'Witch Hunter Raids (II) can be triggered only after 'A Matter of Life and Death' and must be completed before\n'Now or Never'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=248616"},{"id":"k:novigrad closed city i","name":"Novigrad, Closed City I","namePl":"Represje w Novigradzie I","level":11,"tips":["-It will become available after 'A Matter of Life and Death' and 'Count Reuven's Treasure'","-Near the large temple of the eternal fire, in northern Novigrad, you will hear the bells ringing every day at \nnoon. You can also hear the bells from the central square."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:novigrad closed city ii","name":"Novigrad, Closed City II","namePl":"Represje w Novigradzie II","level":1,"tips":["-It will become available after 'A Matter of Life and Death' and 'Count Reuven's Treasure'"],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:carnal sins","name":"Carnal Sins","namePl":"Śmiertelne grzechy","level":16,"tips":["-Complete before the 'Isle of the Mists'.","-If you found the dwarf during 'Pyres of Novigrad', this is the quest that you will find his dead body.","-There is a unique scene at the gate of the morgue in Novigrad after the serial killer attacks Priscilla. When you \nare with Von Gratz during 'Carnal Sins', tell him you are not ready to go just yet after Priscilla is attacked. Then \nhead to the gate and interact with the guard to get a cutscene.","-In the 'Carnal Sins' quest, inspect corpse genitals twice for a unique line.","-Crippled Kate's has no female clients and only 1 male worker.","-During Carnal Sins, you can take Reverend Nathaniel's poker, but make sure to choose the \ncorrect dialogue to get correct information first. It keeps its heated glow when using it.","-Once you've completed 'Carnal Sins', you can access a side quest that was created by fans, but only \naccessible if you install the mod titled 'A Witcher Can Hide Another'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Carnal_Sins","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425981"}]},{"region":"Velen","steps":[{"id":"k:in the eternal fire s shadow","name":"In the Eternal Fire's Shadow","namePl":"W cieniu Wiecznego Ognia","level":15,"tips":["-Complete 'Funeral Pyres' before this quest so that you can get some unique dialogue.","-Make sure you have completed Keira's quest, 'Magic Lamp', so that you have the lamp that can \nreveal ghosts in this quest.","-'In the Eternal Fire's Shadow', you can deal with the bandits in the Devil's Pit before speaking with the deacon, \nand Geralt will respond with some unique dialogue saying that they were already dealt with.","-In the Eternal Fire's Shadow has multiple endings and you can see them in this video.","-In the Eternal Fire's Shadow, if you die during combat, you'll get a unique death scene.","-During 'In the Eternal Fire's Shadow', there are a couple references to 'Funeral Pyres' if you had completed \nit beforehand.","-The spectre in 'In the Eternal FIre's Shadow' will mention the pesta from 'Towerful of Mice' if you brought the \nbones to Graham.","-If you get one of the good endings for 'In the Eternal Fire's Shadow', you will see a dog in Devil's Pit named \nKal. This is likely a reference to Henry Cavill's dog who is also named Kal.","-'In the Eternal Fire's Shadow', if you refuse to bring down the deacon and refuse to tell the deacon the \nspecifics of what happened, the deacon will be grateful and will ask for your name. Geralt responds by saying \n'Reinald' and the deacon then names the hospital he creates using Reinald's name, even though he thinks \nhe's using Geralt's name.","-'In the Eternal Fire's Shadow', there is a closed off building near the top of Devil's Pit. If you get the good \nending where the area becomes populated with people, this building will become open with a merchant inside."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/In_the_Eternal_Fire%27s_Shadow","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=221247"}]},{"region":"Novigrad/Oxenfurt","steps":[{"id":"k:now or never","name":"Now or Never","namePl":"Teraz albo nigdy","level":14,"tips":["-Complete before the 'Isle of the Mists'.","-When Triss leaves her Novigrad residence during Now or Never quest, her landlords can be seen \nrummaging through her things (before you join up with Triss).","-During 'Now or Never' when saving Berthold and Annise, you can speak with their landlords on \nthe main floor before you leave the house. You can punch the man.","-If you saved Moritz after 'A Matter of Life and Death', you can find him with the other mages during 'Now \nor Never'.","-During the quest 'Now or Never', when you are underground in the tunnels, you will come across a hidden \nlibrary, which happens to be directly under the actual city library."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425984"},{"id":"k:a deadly plot","name":"A Deadly Plot","namePl":"Spisek","level":14,"tips":["-'A Deadly Plot' must be completed before 'Isle of the Mists'.","-Thaler's monocle dialogue is now fixed in the next gen update. If you picked up the monocle in the quest\n 'A Frying Pan, Spick and Span', you can return it to Thaler in 'A Deadly Plot'.","-The Passiflora innkeeper might be the only vendor that sells cucumbers and bananas.","-The Passiflora has some rich female clients and several male workers."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Deadly_Plot","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425988"},{"id":"k:playing thaler","name":"Gwent: Playing Thaler","namePl":"Gwint: Partyjka z Talarem","level":1,"tips":["-This quest appears right after you escort Thaler back to his wagon in 'A Deadly Plot'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the most truest of basilisks","name":"The Most Truest of Basilisks","namePl":"Najprawdziwszy z bazyliszków","level":null,"tips":["-This quest will only appear between 7am and 6pm.","-In the Most Truest of Basilisks, once the fight begins, the Beast Tamer will take off running towards Novigrad Gate where he will cower in fear behind a small building. Geralt can follow him until he stops running, but \nwill not be able to interact with him."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=214260"},{"id":"k:message from an old friend","name":"Message from an Old Friend","namePl":"Znajomy z dawnych czasów","level":1,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Message_from_an_Old_Friend","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=425982"},{"id":"k:empty coop","name":"Empty Coop","namePl":"Drób w opałach","level":1,"tips":["-During Empty Coop, you can persuade the old lady to take in the children at the end of the quest. After a \ncouple weeks in game, or after completing one or two quests, you can return to the hut and hear some dialogue\nbetween the old lady and the children."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Empty_Coop","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=empty-coop-"},{"id":"k:hey you wanna look at my stuff","name":"Hey, You Wanna Look at My Stuff?","namePl":"Tajemniczy handlarz","level":6,"tips":["-There is a potential God of War reference, which is a man that somewhat looks similar to Kratos. It most likely \nis not a reference to Kratos since the character model is not as muscular, but he is bald, pale, and has red \nmarks where the blades of chaos would be. It's on the beached ship directly north of the Novigrad Docks and \nSouth West of Electors' Square. The link will show you an image."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Hey,_You_Wanna_Look_At_My_Stuff%3F","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20119"},{"id":"k:novigrad hospitality","name":"Novigrad Hospitality","namePl":"Novigradzka gościnność","level":8,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Hospitality","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=214267"},{"id":"k:of dairy and darkness","name":"Of Dairy and Darkness","namePl":"Nabiał i ciemne siły","level":9,"tips":["-Purchase the lizard figurine from the merchant in Gildorf to begin the quest.","-The lever at the top of Aeramas's residence simulates a 'light switch' that essentially turns off the sun for a few\nseconds. The mage was testing this and the lever has no other functional purpose for the quest.","-In the quest, 'Of Dairy and Darkness', you will eventually receive The Emmentaler sword. What you may not \nhave noticed, is that it can be dismantled into cheese."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:spooked mare","name":"Spooked Mare","namePl":"Nasza Szkapa","level":12,"tips":["-Spooked Mare, bring the wrong horse to make the horse master happier and give you \nmore coins @13:12."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:black pearl","name":"Black Pearl","namePl":"Czarna perła","level":13,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Black_Pearl","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=black-pearl"},{"id":"k:little red","name":"Little Red","namePl":"Wilczyca (Wiedźmin 3)","level":15,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Little_Red","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=little-red"},{"id":"k:a feast for crows","name":"A Feast for Crows","namePl":"Uczta dla kruków","level":20,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:of swords and dumplings","name":"Of Swords and Dumplings","namePl":"Miecze i pierogi","level":24,"tips":["-The sword you get from 'Of Swords and Dumplings' now levels up with your character.","-During 'Of Swords and Dumplings', if you sided with Iorveth in the Witcher 2, you will be able to persuade \nthe dwarf to let you in without bribes or axii.","-After finishing 'Of Swords and Dumplings' with Hattori, you can have a bit of follow-up in Skellige. If you go to Urialla Harbor, you can run into Sukrus, his brother in law, and the rival sword merchant they took from Novigrad. You can overhear them and it seems they intend to start a business again. You can't interact with them though."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=30518"},{"id":"k:a final kindness","name":"A Final Kindness","namePl":"Ostatnia przysługa","level":26,"tips":["-Only available if you send Keira to bargain with Radovid during 'For the Advancement of Learning'. This is the \nbad ending for Keira. The link is the video of this quest if you want to watch it."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:an elusive thief","name":"An Elusive Thief","namePl":"Zlecenie: Nieuchwytny złodziejaszek","level":13,"tips":["-If you want to be able to craft all of the possible decoctions, you must kill the doppler, since this is the only \nopportunity to get a doppler mutagen for the doppler decoction."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_An_Elusive_Thief","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20032"},{"id":"k:the white lady","name":"The White Lady","namePl":"Zlecenie: Biała Dama","level":16,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_The_White_Lady","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=19975"},{"id":"k:doors slamming shut","name":"Doors Slamming Shut","namePl":"Zlecenie: Nawiedzony dom","level":24,"tips":["-During Doors Slamming Shut, if you say you are from the School of the Griffin, you can haggle for \nmore money.","-During the contract: Doors Slamming Shut, Kurt Dysart (the quest giver) will die at a later time if the supports \nbreak when fighting the elemental. If they do not break, or only one breaks, Kurt will survive. If you break the \npillars, when you return to the house, you will get an extra cutscene where you learn he actually died. \nUse the strategy @13:49 to fight the elemental in the corner to try and prevent the supports from breaking."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Doors_Slamming_Shut","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=doosr-slamming-shut"},{"id":"k:lord of the wood","name":"Lord of the Wood","namePl":"Zlecenie: Opiekun lasu","level":25,"tips":["-In the Cunny of the Goose brothel, there is a secret area behind a curtain @14:13 (you can't \ngo into this area, but you can observe it from a window outside).","-When doing the 'Lord of the Wood', after speaking with the Dwarf, when exiting the building, you will see \na murder of crows leaving. The leshen has them as spies and will now know you are coming."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_Lord_of_the_Wood","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=19974"},{"id":"k:coast of wrecks","name":"Coast of Wrecks","namePl":"Wybrzeże Wraków","level":13,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:battlefield loot","name":"Battlefield Loot","namePl":"Łupy z pobojowiska","level":20,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:cat school gear basic","name":"Cat School Gear (Basic)","namePl":"Poszukiwania: rynsztunek szkoły kota","level":17,"tips":["-Crazy cat lady outside of Novigrad has a diary that can start the hunt for the feline armor. You can follow\nher around and she'll say odd things."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=563226"},{"id":"k:cat school part 1","name":"Cat School Part 1","namePl":"Wiedźmińska szkoła cechu Kota","level":23,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:big city players","name":"Gwent: Big City Players","namePl":"Gwint: Rozgrywki w Novigradzie","level":1,"tips":["-In 'Gwent:Big City Players', don't face Marquise Serenity until after you've met Dijkstra, otherwise the quest will \ncomplete without facing Dijkstra (though you can still face him and acquire his card). If you face her though, it \nshouldn't prevent you from finding all the Gwent cards, it just allows the Big City Players quest to continue \nwithout finishing too early."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Gwent:_Big_City_Players","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=20038"},{"id":"k:high stakes","name":"Gwent: High Stakes","namePl":"O wysoką stawkę","level":26,"tips":["-You must win the tournament to get the missable cards and beat Tybalt to unlock the missable achievement \nGwent Master."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:fists of fury novigrad","name":"Fists of Fury: Novigrad","namePl":"Wściekłe pięści: Novigrad","level":23,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Skellige","steps":[{"id":"k:worthy of trust","name":"Worthy of Trust","namePl":"Kredyt zaufania","level":1,"tips":["-There are 3 separate locations that you can find this man and he will eventually pay the loan with interest. Even\nthough it does not appear in your quest log at first, when you talk to the man the third time, it will complete and\nit will be in your completed quest list. \nLocation 1.","Location 2.","Location 3."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=29933"},{"id":"k:echoes of the past","name":"Echoes of the Past","namePl":"Echa przeszłości (Wiedźmin 3)","level":17,"tips":["-Grab the Undvik armor set @1:23 armourer just after the bridge. Note that the set does not level with you, \nbut if you wait until you are a higher level, the set will also be a higher level.Get the matching \nUndvik horse gear from the armorer of Kaer Trolde as well."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Echoes_of_the_Past","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=555844"},{"id":"k:taken as a lass","name":"Taken as a Lass","namePl":"Porwana za młodu","level":25,"tips":["-Don't talk to Kuriso first because it will auto complete."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:missing persons","name":"Missing Persons","namePl":"Ktokolwiek widział, ktokolwiek wie","level":15,"tips":["-During 'Missing Persons', as you enter the village looking for Ciri with Yen, talk to a man before joining \nthe circle.","-Find a portal with hounds of the wild hunt in Skellige after Ciri's quest in Skellige. North of the wolven superior \nsteel sword diagrams."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Missing_Persons","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=555845"},{"id":"k:nameless","name":"Nameless","namePl":"Bezimienny","level":14,"tips":["-Morkvaarg best ending. Free him, get information, then kill him."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Nameless","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=153962"},{"id":"k:the calm before the storm","name":"The Calm Before the Storm","namePl":"Cisza przed burzą","level":14,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/The_Calm_Before_the_Storm","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=153963"},{"id":"k:in ciri s footsteps skellige","name":"In Ciri's Footsteps: Skellige","namePl":"Śladami Ciri: Skellige","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Vizima","steps":[{"id":"k:in ciri s footsteps velen novigrad and skellige","name":"In Ciri's Footsteps (Velen, Novigrad, and Skellige)","namePl":"Śladami Ciri","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Skellige","steps":[{"id":"k:in wolf s clothing","name":"In Wolf's Clothing","namePl":"W wilczej skórze","level":15,"tips":["-Morkvaarg best ending. Free him, get information, then kill him."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/In_Wolf%27s_Clothing","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=425997"}]},{"region":"Novigrad/Oxenfurt","steps":[{"id":"k:redania s most wanted","name":"Redania's Most Wanted","namePl":null,"level":12,"tips":["-Complete before the 'Isle of the Mists'.","-All green checkmarks for 'Redania's Most Wanted' objectives. There are two options in the reddit post. The \nbest way is to show Yen the crystal right after 'Last Wish' (she disappears if you walk out of the room after \n'Last Wish', so speak with her right away), but don't give it to her. Don't talk with Triss about the crystal\nat all since it will for some reason make one of the objectives fail. Bring Radovid the crystal and give it \nto him. Even though you didn't show Triss the crystal, it will still mark it as complete. If you showed both \nTriss and Yen, for some reason it'll mark the Yen portion as failed.","-Please note that if you plan on breaking up with Yen during the next quest, 'The Last Wish', then you won't be\nable to show Yen the crystal after that quest is done. If you do want to show her it, make sure to do it before \nstarting 'The Last Wish' or just show Triss the crystal instead if you don't care about all objectives being \ncomplete.","-If you speak to Triss and Yen before giving the crystal to either the witch hunters or Radovid, you will get some\nunique dialogue, but talking to both will also cause a failed objective in the quest list."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Novigrad_Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=redanias-most-wanted"}]},{"region":"Skellige","steps":[{"id":"k:the last wish","name":"The Last Wish","namePl":"Ostatnie życzenie","level":15,"tips":["-Complete before 'Ugly Baby'.","-During 'The Last Wish', while investigating the second shipwreck, you can find 'pirate booty' further down with \nsome funny dialogue.","-Once the quest finishes, make sure you speak to Yen immediately while she is in the inn because she will leave\nright after you exit and fast travel away. Get the dialogue option for bringing her the crystal from 'Redania's Most\nWanted', but do NOT give her the crystal. Please note that this will only be possible if you tell Yen you love her \nstill. If you break up with her, she'll leave before you with no chance of talking to her about the crystal. So it is\nsuggested you talk to her about the crystal before starting this quest.","-As soon as you finish this quest, talk with Yen before leaving and give her the raven skull that you hopefully \nfound and picked up at the beginning of the game. There will be some unique dialogue about this.","-Deleted content about Yennefer's fertility.","-Deleted dialogue with the Brothers in Arms mod where Yennefer refuses to be intimate with Geralt at the end \nof 'Last Wish'.","-Deleted scene between Geralt and Yennefer after The Last Wish quest. This content can be downloaded with \nthe Brothers in Arms mod.","-Deleted dialogue with the Brothers in Arms mod where there is a new romance scene with Yennefer after \n'The Last Wish'.","-The Last Wish Project (mod with questline)."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=153964"},{"id":"k:yustianna disturbed","name":"Yustianna Disturbed","namePl":"Zaniepokojona Yustianna","level":null,"tips":["-In Yustianna's Grotto, you will encounter some bandits. You can trigger a specific cutscene if you enter \na certain way. When you enter the cave, there will be two paths, one that requires the eye of \nNahenali and the other is a regular path. Even though you would want to use the hidden path, you will get \ninteresting dialogue if you take the normal route to the bandits. The bandits will attack right away if you use \nthe hidden path. They will also attack if you give them money and then return."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:finders keepers","name":"Finders Keepers","namePl":"Znalezione nie kradzione","level":24,"tips":["-This quest is proximity sensitive and will fail if you leave the area."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:call of the wild","name":"Call of the Wild","namePl":"Zew dziczy","level":null,"tips":["-'Call of the Wild' can only be triggered at night."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:siren s call","name":"Siren's Call","namePl":"Wrzask syreny","level":null,"tips":["-Sailing the seas at night, you can see a ghost ship between 1am and 3am at the location in the video.","-You can see whales in full while underwater. In the video, it also shows the spawning location of the whales."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:never trust children ii","name":"Never Trust Children (II)","namePl":"Nigdy nie ufaj dzieciom","level":null,"tips":["-This quest is proximity sensitive and will fail if you leave the area."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the phantom of eldberg","name":"The Phantom of Eldberg","namePl":"Zlecenie: Upiór z Eldbergu","level":17,"tips":["-You must complete 'The Phantom of Eldberg' in order to start a 'Stranger in a Strange Land'.","-How to save Jorund without sacrificing the children of the Jarls (the 2 men that attack you in the inn). Jorund \nis the one that triggers the 'Phantom of Eldberg' quest. One way to do this is to complete the quest AFTER the \nmassacre at Kaer Trolde. Nobody antagonizes you afterwards, and Jorund lives. It is NOT recommended to do \nthis though because certain characters die during the massacre, and if you do that first, you will miss out on \nsome interesting side quests. So unfortunately, it is best not to save Jorund and to just watch this video instead!","-In 'Phantom of Eldberg', you can find an interaction between two kids looking at a skeleton. It is on the rock \njust west of the boat symbol which is found north of Arinbjorn. The boy's name is Ove and might be the son\nof another man named Ove that was involved with some piracy business.","-In 'The Phantom of Eldberg', south of the Eldberg Lighthouse, the bridge has been fixed in the update. There \nused to be a gap that would frequently cause you to dive into the water below, but it is now fully patched up, \nliterally."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Contract:_The_Phantom_of_Eldberg","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=213461"},{"id":"k:stranger in a strange land","name":"Stranger in a Strange Land","namePl":"Obcy w obcym kraju","level":14,"tips":["-Complete before King's Gambit and make sure to accept help from Simun Brambling in order to unlock the\nquest 'An Unpaid Debt' once you finish 'The Cave of Dreams'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=425999"},{"id":"k:the cave of dreams","name":"The Cave of Dreams","namePl":"Jaskinia Snów (zadanie)","level":14,"tips":["-Complete before 'King's Gambit'.","-If you go along the ramparts of the back of Madman Lugos's fort in Kaer Muire, you will find a small opening \non one of the walls that has a bucket next to it that includes a dead rat. At the base of the wall, you will find \nanother dead rat, dead bodies, and other trash.","-In 'The Cave of Dreams', if you find the cave before starting the quest, it will only be a small section \ncompared to what you see during the actual quest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=30570"},{"id":"k:an unpaid debt","name":"An Unpaid Debt","namePl":"Niespłacony dług","level":15,"tips":["-It is only available if 'Stranger in a Strange Land' has been completed with the help of \nSimun Brambling, and after completion of 'The Cave of Dreams'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/An_Unpaid_Debt","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=425998"},{"id":"k:farting trolls","name":"Farting Trolls","namePl":"Pierdzące trolle","level":null,"tips":["-Find the farting trolls."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:possession","name":"Possession","namePl":"Wybraniec bogów","level":17,"tips":["-Complete before 'Battle Perparations' and ask about health at the beginning with Hjort.","-If you did not complete Cerys's quest, 'Possession', then you can continue to see the shadow behind Jarl \nUdalryk in certain scenes."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Possession","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=426125"},{"id":"k:the lord of undvik","name":"The Lord of Undvik","namePl":"Władca Undvik","level":17,"tips":["-Complete before 'Battle Preparations'.","-'Lord of Undvik', optimal order guide to follow.","-'Lord of Undvik', when asking around the New Port Inn about Undvik, you can talk to Jonas the Innkeep, \nAxel, and Tante and Javor.","-'Lord of Undvik', you can actually bring some nails (which can be found near Hjalmer) back to Octo once you \nfind them, but it has to be brought back before the end of this quest, otherwise Octo will have disappeared.","-'Lord of Undvik', if you don't go back with Hjalmer after killing the giant, return to Octo. You can tell him you \nkilled the giant and he will have some dialogue.","-'Lord of Undvik', you can find shackles behind the boat that Octo is building. It seems shackles and a new \nsail (which I couldn't find) are separate objectives that are autocompleted most likely because it was an idea \nfor the quest but was taken out later in development.","-North West of Marlin Coast, you can find 2 rock formations that look similar to a cat and a dog.","-There's a bear shrine found in the southern most part of Skellige, dead men tied to a ship's wheel, and birds \ndoing weird formations. The location is in one of the 4 pics on the linked reddit post."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=426000"}]},{"region":"Novigrad/Oxenfurt","steps":[{"id":"k:deadly delights","name":"Deadly Delights","namePl":"Zlecenie: Śmiertelne rozkosze","level":15,"tips":["-Spare her to get the sword Maugrim.","-In the contract, 'Deadly Delights', you will meet a succubus named Salma. You can also find her name in the \ncreepy cult house found near one of the sign posts in White Orchard.","-Before entering Crippled Kate's brothel again after this quest, ('Out on your Arse!' becomes available after\nDeadly Delights contract), complete the Lord of Undvik first so you can resolve the matter peacefully (option\n3 in the dialogue choices)."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:out on your arse","name":"Out on Your Arse!","namePl":"Wykidajło","level":14,"tips":["-Available right after 'Deadly Delights'. Complete immediately. Fast travel away from the area and then fast \ntravel back in order to trigger this quest."],"nonMissable":true,"wikiUrl":null,"mapUrl":null}]},{"region":"Skellige","steps":[{"id":"k:woe is me","name":"Woe is Me","namePl":"Biada mi!","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:king s gambit","name":"King's Gambit","namePl":"Królewski Gambit","level":18,"tips":["-Complete before 'Battle Preparations'.","-During King's Gambit quest, after helping Hjalmer and Cerys. During the coronation argument, before \nreporting to Crach, go find Cerys when she is walking away @0:48.","-Hjalmer's sword: 'King's Gambit' quest, after helping him and Cerys. During the coronation argument, \nbefore reporting to Crach, go back to where the argument cutscene ended. Fight the Vildkaarls to get\nHjalmer's sword. You can then fistfight 3 more opponents.","-During 'King's Gambit' in the dinner hall, you can hear a bard recount Cerys's quest with the Hym if you \ncompleted it.","-During 'King's Gambit', you can prevent a massacre from ever occuring IF you do not do Cerys or Hjalmar's \nside quests ('Possession' and 'The Lord of Undvik'). This will result in Svanrige becoming king since Cerys \nand Hjalmar cannot make strong enough claims, and it is unnecessary for Birna to cause chaos.","-If the massacre does not occur during 'King's Gambit', certain characters that would have died can be found. \nThese include: The Bard Drogodar, Otrygg an Hindar, Halbjorn, and possibly Blue Boy Lugos (though xLetalis \ncouldn't find him afterwards).","-During 'King's Gambit', if you are too slow to catch Arnvold while chasing him by horse, there is a unique \nscene.","-If you refuse to help Cerys and Hjalmar with their tasks, their ultimate fate can be seen in this video.","-Find Birna Bran after this quest is done if you sided with Cerys.","-Deleted ambient dialogue with the Brothers in Arms mod where you can hear Birna Bran telling Svanrige \nto leave the hall during the feast to protect him from the attack.","-Deleted dialogue with the Brothers in Arms mod where Birna Bran lies to her son during the trial in the quest \n'King's Gambit'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/King%27s_Gambit","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=426124"},{"id":"k:coronation","name":"Coronation","namePl":"Koronacja","level":18,"tips":["-Complete before 'Battle Preparations'.","-Right after 'Coronation', you can talk with Cerys, Hjalmer, Crach, Udalryk, and Ermion."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the four faces of hemdall","name":"The Four Faces of Hemdall","namePl":"Cztery twarze Hemdalla","level":null,"tips":["-Location of the shrines to change the weather in Skellige @0:21","-Skellige land drawings. There are 10 in the full video."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:brave fools die young","name":"Brave Fools Die Young","namePl":"Gdyby kózka nie skakała","level":1,"tips":["-This quest will disappear if you travel too far away from it after first coming across it.","-This quest seems to not have any quest objectives, but it actually has two if you talk to the guy with no \nCelandine in your inventory."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:iron maiden","name":"Iron Maiden","namePl":"Żelazna dziewica","level":19,"tips":["-Complete this before facing off against Olaf in the fist fighting event. If you've already fought Olaf during \nthe Skellige fist fights, during the 'Iron Maiden' quest, she won't give you a task to complete before fighting you."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Iron_Maiden","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=secondary-quest-the-iron-maiden"},{"id":"k:fists of fury skellige","name":"Fists of Fury: Skellige","namePl":"Wściekłe pięści: Skellige","level":30,"tips":["-Before facing Olaf, complete 'Iron Maiden' so that you can get a task from her."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the tower outta nowheres","name":"The Tower Outta Nowheres","namePl":"Wieża znikąd","level":30,"tips":["-Complete 'The Tower Outta Nowheres' in order to trigger 'The Path of Warriors'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=30533"},{"id":"k:the path of warriors","name":"The Path of Warriors","namePl":"Szlak bohaterów","level":16,"tips":["-In 'The Path of Warriors', if you surface halfway through the swimming section, you can face off against two \ngargoyles and get some unique dialogue from Geralt."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=path-of-a-warrior"},{"id":"k:a hallowed horn","name":"A Hallowed Horn","namePl":"Bardzo cenny róg","level":12,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/A_Hallowed_Horn","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=30578"},{"id":"k:from a land far far away","name":"From a Land Far, Far Away","namePl":"Za siedmioma morzami","level":13,"tips":["-During the 'from a land far, far away' quest, you can find zebra crests on the ship.","-In 'From A Land Far Away', you can meet the man before meeting the woman and child and it will result in \nslightly different interactions."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:free spirit","name":"Free Spirit","namePl":"Wolny duch","level":13,"tips":["-Free Spirit @5:13 Find a guy that is about to be murdered. Save him. Buy several books for \nhim @5:51. After, he can be seen in Novigrad close to Odrin and has a cutscene.","-In 'Free Spirit', the meeting location of Ivar after the quest is done is at the docks west of St. Gregory's Bridge."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:nithing","name":"Nithing","namePl":null,"level":14,"tips":["-'The Nithing', if you reflect the curse and come back days later, Jonna will be gone and the boy will be\nhealthy again."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:master of the arena","name":"Master of the Arena","namePl":"Mistrz areny","level":14,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Master_of_the_Arena","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=master-of-the-arena"},{"id":"k:the price of honor","name":"The Price of Honor","namePl":"Cena honoru","level":14,"tips":["-In 'The Price of Honor', you can actually find the woman's dowry in an underwater shipwreck. You can even \ngive it back to the man or sell it.","-On Faroe @23:15 'Price of Honor', after you finish it, go back to the place the woman was killed. \nYou can find the quest giver there.","-In Skellige, East of Harviken, you can find a large obelisk that you can't interact with. You can also find a cave \nWest of Harviken that seems to have an inactive portal.","-Deleted character with the Brothers in Arms mod where you can meet a merchant named Gramps in Harviken, \nnear 'The Price of Honor' quest."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=30580"},{"id":"k:the family blade","name":"The Family Blade","namePl":"Miecz rodowy","level":15,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Side_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=30543"},{"id":"k:for fame and glory","name":"For Fame and Glory","namePl":"Dla sławy i chwały","level":15,"tips":["-During 'For Fame and Glory', the two soldiers must survive in order to successfully complete the quest. \nThere are exploding necrophages, so it can be tricky. You can either axii the soldiers to make them stay \noutside, or use a lot of bombs before the soldiers even have a chance to get to the monsters."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/For_Fame_and_Glory","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/skellige-isles?marker=30586"},{"id":"k:armed assault","name":"Armed Assault","namePl":"Napad z bronią w ręku","level":15,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:a bard s beloved","name":"A Bard's Beloved","namePl":"Narzeczona dla barda","level":15,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:crime and punishment","name":"Crime and Punishment","namePl":"Zbrodnia i kara","level":18,"tips":["-'Crime and Punishment', find the sister a Forktail'."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/To_Bait_a_Forktail...","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/kaer-morhen?marker=22381"},{"id":"k:the final trial","name":"The Final Trial","namePl":"Ostatnia Próba","level":19,"tips":["-Instead of getting in the boat with Lambert during 'The Final Trial', if you swim all the way across, you will get\na unique cutscene with Lambert. Unfortunately, this cutscene is only available if you install the Brothers in \nArms mod, but the video is attached if you would like to watch it.","-During 'The Final Trial', if you have the Brothers in Arms mod installed, when you reach the missing boat with \nLambert, there is slightly different dialogue. Geralt deduces that the wind from the recent storm caused the boat \nto go into the bushes. While searching for it, Geralt comments that he can hear the sails flapping.","-In the Kaer Morhen region, go to the ruined Watchtower which is in the northern region of the map near the tip \nof the lake. Then if you go south of it along the shore of the lake, you will eventually come across a painting \neasel and a lootable chest.","-In 'The Final Trial', when you encounter the harpies, Lambert will compliment your fighting style. If you use \nyour crossbow, he will say \"Nice shot\". If you use the crossbow a couple more times, he refer to your crossbow \nas 'gabriel'.","-In 'The Final Trial', before you enter the cave, you will hear a child screaming. There are two pieces of rare \ndialogue here depending on what you do. The first is if you agree to ignore the sound, then change your mind \nand inspect the area, Lambert will have something to say. The second is if you choose to investigate the sound, \nbut then go into the cave right away, Lambert will have something else to say.","-In 'The Final Trial', when Lambert is helping you up the rock, you can fall back down from the side you came \nup on and you'll get a funny moment with Lambert.","-In 'The Final Trial', when finding Old Speartip, aarding the rocks along the way inside the cave will actually \nwake him up in the next gen edition and you can hear him waking up if you have the Brothers in Arms mod \ninstalled.","-In 'The Final Trial', when you exit the cave, you will have two dialogue options. They both reference something. \nThe first one references the 'killing monsters' part of one of the Witcher 3 cinematic trailers. The other dialogue \noption references the ending of the Witcher book series.","-In 'The Final Trial', when you encounter the trolls and they start throwing rocks at you, you can actually shoot \na crossbow bolt or bomb at them and they will flee. The dialogue in your following encounter with them will also \nbe different if you did it this way. You can still deal with them peacefully if you do it this way.","-In 'The Final Trial', if you follow the trolls back to their lair, you can overhear them telling a joke. If you speak \nwith the troll guarding your stash, he will also have something to say. The trolls you follow will also warn you not \nto enter their cave. If you do, you will be forced to fight them, unless you wait until after the quest is done.","-In 'The Final Trial', you can loot the troll cave without fighting them if you do it after the quest and tell \nLambert that you'll meet him back at Kaer Morhen. If you try looting the troll cave before the end of the \nquest, the trolls will attack you.","-In 'The FInal Trial', if you try to take back your stash from the troll that is guarding it, he will only become \naggressive if you try to take a silver sword. If you trigger the fight, you can go and light the candles at the \naltar to skip the fight altogether.","-In 'The FInal Trial', if you cut the emotional ending of Lambert's story short, Lambert makes a comment, \nimplying that he killed his father. This might also reference Yennefer, since the books suggest that she also \nkilled her father once finding out about her power.","-In 'The Final Trial'. there is some dialogue where Lambert talks about how he used axii on a couple of road \nrobbers. He made the one shoot his friend with a crossbow and then hang himself. This scene is referred to \nin 'Dead Man's Party' in Hearts of Stone.","-After 'The Final Trial' is complete, you can find Lamert back at Kaer Morhen and you can get 2 pieces of unique \ndialogue. The first is about Ciri and can only be heard before you lift the curse. The second piece of dialogue is \nregarding how Lambert hasn't changed at all."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/The_Final_Trial","mapUrl":null},{"id":"k:old pals","name":"Gwent: Old Pals","namePl":"Gwint: Starzy znajomi","level":5,"tips":["-Make sure to play against Lambert for his card if you haven't already."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:berengar s blade","name":"Berengar's Blade","namePl":"Miecz Berengara","level":27,"tips":["-Complete before starting 'The Battle of Kaer Morhen'.","-Before the 'Battle of Kaer Morhen', find a chest in a small cell in the outside area of Kaer Morhen. This will \nstart Berengar's quest. Talk to Vesemir about the blade."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:trail of echoes","name":"Trail of Echoes","namePl":"Ścieżka ech","level":null,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:no place like home","name":"No Place Like Home","namePl":"Nie ma jak w domu","level":19,"tips":["-In Kaer Morhen, if you romanced Yennefer, you can end up making love to her and the scene will cut to a \ngroup of wolves chasing a deer. At the very end, the deer and wolf both jump over the bridge. It turns out \nthat the wolf ended up dying when trying to make this jump and you can find its body under the broken bridge \nnear the Iron Mine signpost. Geralt will make a comment as you approach and investigate it.","-During 'No Place Like Home', if you go to the bedroom with Yennefer, and say that you play Gwent for pleasure, \nyou can get some unique dialogue from Lambert in which his voice cracks.","-During 'No Place Like Home', if you cut the drinking short, you will get a unique scene between the three \nwitchers."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_and_Wine_Quests","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/toussaint?marker=426129"},{"id":"k:va fail elaine","name":"Va Fail Elaine","namePl":"Va faill, elaine","level":19,"tips":["-Deleted scene available with the Brothers in Arms mod where either Eskel or Geralt cleans up the puke from \nUMA during 'Va Fail, Elaine' depending on whether you romanced her or not.","-Deleted scene available with the Brothers in Arms mod where Vesemir or Geralt cooks food for Yennefer \nduring 'Va Fail, Elaine' depending on if you are in a relationship with her or not. You can either make an omelette, \nscrambled eggs, or something inedible."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Va_Fail,_Elaine","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/kaer-morhen?marker=555848"},{"id":"k:bastion","name":"Bastion","namePl":"Bastion","level":23,"tips":["-In the 'Bastion' quest, there are 5 total spots to use the lamp. 1 on the ground floor, 3 on the main floor, and \n1 in the ruined tower.","-In Kaer Morhen, north of the Bastion, you will find a cave. East of this cave, you will find some gravestones \nthat may be where they buried witchers that did not survive the trials. The location is a bit more north east of \nwhere it says in the video. Right before the edge of a cliff."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:monster slayer","name":"Monster Slayer","namePl":"Sąsiedzka sprzeczka","level":26,"tips":["-Find Leo's grave (from the Witcher 1)."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:greenhouse effect","name":"Greenhouse Effect","namePl":"Efekt cieplarniany","level":27,"tips":["-Return to the 'Greenhouse Effect' area to pick up herbs. Return a third time to fight a bear."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the witchers forge","name":"The Witchers' Forge","namePl":"Wiedźmińska kuźnia","level":30,"tips":["-Area found before meeting Yen at the top of the stairwell @3:50 10 things you may have missed in \nKaer Morhen (Starts 'A Witchers' Forge')."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:wolf school gear basic","name":"Wolf School Gear (Basic)","namePl":"Poszukiwania: rynsztunek Szkoły Wilka","level":14,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:wolf school part 2","name":"Wolf School Part 2","namePl":"Wiedźmińska Szkoła Cechu Wilka","level":21,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:wolf school part 4","name":"Wolf School Part 4","namePl":"Wiedźmińska Szkoła Cechu Wilka","level":29,"tips":[],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:forgotten wolf school gear part 1","name":"Forgotten Wolf School Gear Part 1","namePl":"Poszukiwania: schematy ulepszeń zapomnianego rynsztunku Wilka","level":34,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Forgotten_Wolf_School_Gear","mapUrl":null},{"id":"k:forgotten wolf school gear part 2","name":"Forgotten Wolf School Gear Part 2","namePl":"Poszukiwania: schematy ulepszeń zapomnianego rynsztunku Wilka","level":40,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Forgotten_Wolf_School_Gear","mapUrl":null}]},{"region":"Velen","steps":[{"id":"k:brothers in arms velen","name":"Brothers in Arms: Velen","namePl":"Towarzysze broni: Velen","level":22,"tips":["-At any point before the ending of the main game, if you have the mark on your face left by Gaunter O'Dimm \nin the DLC Hearts of Stone, you can get unique dialogue options from Triss, Yen, Ciri, and even Regis (in the \nBlood and Wine DLC) if you speak to him in Dettlaff's toyshop before finishing Hearts of Stone."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Brothers_in_Arms:_Velen","mapUrl":null}]},{"region":"Novigrad/Oxenfurt","steps":[{"id":"k:brothers in arms novigrad","name":"Brothers in Arms: Novigrad","namePl":"Towarzysze broni: Novigrad","level":22,"tips":["-In Novigrad, you can sometimes get an interaction with witch hunters later on in the game. It can happen near \nHattori's or more likely just as you enter inside one of the main entrances. It always results in a fight once the \nhunters pull you aside. I was able to trigger it, but not consistently."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Brothers_in_Arms:_Novigrad","mapUrl":null}]},{"region":"Vizima","steps":[{"id":"k:brothers in arms nilfgaard","name":"Brothers in Arms: Nilfgaard","namePl":"Towarzysze broni: Nilfgaard","level":22,"tips":[],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Brothers_in_Arms:_Nilfgaard","mapUrl":null}]},{"region":"Skellige","steps":[{"id":"k:brothers in arms skellige","name":"Brothers in Arms: Skellige","namePl":"Towarzysze broni: Skellige","level":22,"tips":["-The sword you get from 'Brothers in Arms: Skellige' after completing both 'Possession' and 'The Lord of \nUndvik', now scales with your character,"],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Brothers_in_Arms:_Skellige","mapUrl":null},{"id":"k:the isle of mists","name":"The Isle of Mists","namePl":"Wyspa Mgieł","level":22,"tips":["-If you do 'Open Sesame' from Hearts of Stone, before starting 'The Isle of Mists' and before 'The Battle of Kaer \nMorhen', you can get a unique piece of dialogue with Vesemir about his old lover.","-The attached video shows the unique dialogue from the Countess, who is Vesemir's old lover, during 'Open \nSesame'. This dialogue is only available if you do 'Open Sesame' before starting 'The Isle of Mists' and before \n'The Battle of Kaer Morhen'.","-Make a hard save before starting this quest since there are many important decisions that you will make and\nif you want to try different decisions after you beat the game, this is a perfect point to start from again. There \nalso won't be any free roam to do other quests until you complete the quest 'Bald Mountain'.","-Cutoff point for many quests. The list of quests that can fail are found halfway down the linked site, and are \nunder the section titled 'Cutoff Point'.","-During 'Isle of Mists', you can find another Dwarf inside a cave."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/The_Isle_of_Mists","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/kaer-morhen?marker=154019"}]},{"region":"Kaer Morhen","steps":[{"id":"k:the battle of kaer morhen","name":"The Battle of Kaer Morhen","namePl":"Bitwa w Kaer Morhen","level":24,"tips":["-Here is a video link on how to get each of the endings for the base game if you need it.","-Before the 'Battle of Kaer Morhen', find Ciri where she used to train.","-During 'The Battle of Kaer Morhen', if Letho comes to Kaer Morhen and Roche and Ves do not, there is a \nbrief scene involving Lambert and Letho.","-In the 'Battle of Kaer Morhen' quest, here are the rewards for choosing either to patch the armory, patch the \nwall, choosing potions, or choosing traps: Patch the Armory: gives a sword called Rose of Shaerrawes. \nPotions: gives thunderbolt, superior swallow, and lesser Perun Runestone. Patching the Wall: provides one \nless wave of enemies. Traps: leads to more enemies getting killed when they trigger the exploding traps.","-In the 'Battle of Kaer Morhen', be careful with mission objectives failing. The third portal in the forest can fail \nif you don't kill the wild hunt enemies in time after setting off their portal. When in the courtyard, an objective \ncan fail if you go right to Triss instead.","-During the 'Battle of Kaer Morhen', interact with Eskel (as Ciri) @4:52 during specific parts to trigger \nglitched cutscene. You can also trigger another scene with Hjalmar near where Ciri used to train. With the next\ngen update, these glitches have been patched, but you can still watch the linked video to see what it looked like.","-It is possible for Lambert to die during this battle, but he can't die if Keira is present, since she will save him.","-Find Keira after the battle, just outside the castle walls. This seems to have been patched in the next gen \nupdate,since she is nowhere to be found after the battle and is presumably somewhere with Lambert if she\nromanced him. Keira will also have some extra dialogue if you speak with her at the funeral pyre."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/The_Battle_of_Kaer_Morhen","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/kaer-morhen?marker=558198"},{"id":"k:blood on the battlefield","name":"Blood on the Battlefield","namePl":"Krajobraz po bitwie","level":20,"tips":["-During 'Blood on the Battlefield', Lambert will respond differently to you depending on whether Keira is \nthere or not.","-Choose: \"I think I know what might lift your spirits.\" Then choose \"All right, Velen it is.\" if you want a \ngood ending for the main story.","-During 'Blood on the Battlefield', if you decide to take Ciri to Emhyr (this will lead to the Empress or \nbad ending), Geralt now gets double the amount for finding and bringing Ciri to Emhyr (from 2k to 4k) \nif he accepts the payment (if you accept, it is more likely to get the bad ending)."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Blood_on_the_Battlefield","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/kaer-morhen?marker=558199"}]},{"region":"Velen","steps":[{"id":"k:bald mountain","name":"Bald Mountain","namePl":"Łysa Góra","level":26,"tips":["-Here is a claim that human flesh and blood is extremely rejuvenating to the crones and possibly required for \nthem to assume their human form. This can be heard during 'Bald Mountain' if you don't move forward while as \nCiri and wait while in the water, before meeting up with the crones.","-After defeating Imlirith and going back to Novigrad, come back to Bald Mountain to find different women \nseducing different cows.","-In the 'Bald Mountain' quest, you can loot a magic acorn from Imlerith's body. If you decide to eat it, it will \ngrant you 2 skill points. You can also give the acorn to the villagers of Bald Mountain, but it won't affect \nanything story related, so best to use it for skill points.","-After dealing with Imlerith, if you go back to Kaer Morhen, you can have additional dialogue with Keira Metz \nabout her and Lambert.","-Hidden secret just north of the Destroyed Bastion. There are a few steps and you should be a high level to fight \na lvl 50 earth elemental. Follow the video for a more clear walkthrough.","-In the hidden secret north of the Destroyed Bastion, there is a cool detail in the bottom room that has a wall \nwith an interesting looking symbol.","-In the hidden secret room north of the Destroyed Bastion, the symbol that can be found can also be found on \nRegis's gloves, in the lair of the Unseen Elder, and in Tesham Mutna.","-In the hidden secret room near the Destroyed Bastion, you can find a dead body outside of the tower that was \nnot there before the next gen update."],"nonMissable":true,"wikiUrl":"https://www.ign.com/wikis/the-witcher-3-wild-hunt/Bald_Mountain","mapUrl":"https://www.ign.com/maps/the-witcher-3-wild-hunt/velen-novigrad?marker=155373"},{"id":"k:master armorers","name":"Master Armorers","namePl":"Mistrz płatnerstwa","level":24,"tips":["-It is recommended to gather these components after you do 'Lord of Undvik' only because it is a much higher\nlevel and it can be done at the same time as this quest, but you can still do this quest at any time if you want."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the griffin from the highlands","name":"The Griffin from the Highlands","namePl":"Zlecenie: Gryf na wzgórzach","level":24,"tips":["-This is associated with 'Components for an Armorer' (essentially the same quest, but a different name for it) \nand can only be done during 'Master Armorers'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:components for an armorer","name":"Components for an Armorer","namePl":null,"level":24,"tips":["-This is associated with 'The Griffin from the Highlands' (essentially the same quest, but a different name for it) \nand can only be done during 'Master Armorers'."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:the beast of honorton","name":"The Beast of Honorton","namePl":null,"level":25,"tips":["-'The Beast of Honorton' turns into 'Where the Cat and Wolf Play'. 'The Beast of Honorton' disappears from the \nquest log and from the completed quest section.","-In the 'Beast of Honorton' quest, if you have the Brother in Arms mod installed, you will have 2 in game days to \nvisit Honorton while it's still intact. After that, it will transition back to its infested and deserted state."],"nonMissable":true,"wikiUrl":null,"mapUrl":null},{"id":"k:where the cat and wolf play","name":"Where the Cat and Wolf Play","namePl":"Jak kot z wilkiem","level":25,"tips":["-Wear Feline armor before starting the 'Where the Wolf and the Cat Play' and Gaetan will \ncomment as you approach him.","-If you decide to spare Gaetan, he will then give you the quest 'Take What You Want'. If you do not spare him, \nyou can't do the 'Take What You Want' quest.","-In 'Where the Cat and Wolf Play', the aunt will address the child quite differently depending on if you gave \nher 40 crowns or not.","-Millie will give a gift near the signpost after some time has passed once the quest is done. You can also \neventually hang this drawing in Corvo Bianco."],"nonMissable":true,"wikiUrl":
